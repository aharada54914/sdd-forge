<h1>sdd-forge MCP 操作比較</h1>
<p>実サーバーから取得した同一の仕様・タスク情報を、2通りの表示で確認します。データは実走時点の固定スナップショットです。製品の状態や承認は変更しません。</p>
<p>各表示で2問に回答し、最後に使いやすかった表示と理由を記録してください。操作時間と根拠を開いた回数はこのページ内だけに保持します。結果はJSONで保存できます。</p>
<button id="start" class="primary">比較を始める</button>
<main id="trial" class="hidden">
 <h2 id="heading"></h2>
 <label>確認する仕様 <select id="feature"><option value="project-skill-observation">project-skill-observation</option><option value="sdd-forge-mcp">sdd-forge-mcp</option></select></label>
 <div id="display"></div>
 <p id="question"></p>
 <div id="choices"></div>
 <p id="feedback" role="status"></p>
</main>
<section id="finish" class="hidden">
 <h2>比較結果</h2><p id="outcome"></p>
 <label>選択 <select id="choice"><option value="">選択してください</option><option value="X">表示Xを採用したい</option><option value="Y">表示Yを採用したい</option><option value="hold">追加検証したい</option><option value="reject">両方とも見送りたい</option></select></label>
 <label>選んだ理由 <textarea id="reason" rows="3" style="width:100%;font:inherit"></textarea></label>
 <button id="save">操作記録をJSONで保存</button>
 <small>これは本人の評価記録です。タスク承認や署名済み判断記録の代わりにはなりません。同一人による繰返しから利用者一般への優劣は推定しません。</small>
</section>

<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const variants=[{label:'X',style:'summary'},{label:'Y',style:'raw'}];
const questions=[{feature:'project-skill-observation',text:'この仕様について、次に進める工程を選んでください。',options:[['implement','実装を開始する'],['spec-review','仕様レビューに進む'],['unknown','この表示では判断できない']],correct:'spec-review'},
{feature:'sdd-forge-mcp',text:'この仕様のタスク状態を確認してください。',options:[['active','未完了の承認済みタスクがある'],['done','承認済みタスクはすべて完了している'],['unknown','この表示では判断できない']],correct:'done'}];
const record={schema:'mcp-human-interaction/v1',snapshot_revision:'4271e1c5d2b673d7f1a4fe2f593c8022cbc4a62f',actor:'unverified-browser-client',started_at:null,questions:[],choice:null,reason:null,source:'native MCP results embedded in this local page; no live backend',adoption_authority:'none'};
let variant=0,question=0,started=0,opens=0,switches=0;
function render(){
 const v=variants[variant],f=$('feature').value;
 $('heading').textContent='表示'+v.label;
 $('display').replaceChildren();
 if(v.style==='summary'){
  const next=data['get_next_sdd_command:'+f];
  const para=document.createElement('p');
  para.textContent=next.ok?('次の工程：'+next.data.phase+'\n'+next.data.nextCommand):'未確認：次の工程を取得できませんでした。';
  para.style.whiteSpace='pre-wrap';$('display').append(para);
  const status=data['get_spec_status:'+f];
  if(status){const p=document.createElement('p');p.textContent='仕様資料：'+(status.ok?status.data.artifacts.filter(a=>a.reviewStatus).map(a=>a.name+' '+a.reviewStatus).join(' / '):'取得失敗');$('display').append(p);}
 }
 for(const [key,value] of Object.entries(data).filter(([key])=>key.endsWith(':'+f))){
  const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');
  summary.textContent=key.split(':')[0]+' の元データ';pre.textContent=JSON.stringify(value,null,2);details.open=v.style==='raw';
  details.addEventListener('toggle',()=>{if(details.open)opens++});details.append(summary,pre);$('display').append(details);
 }
 const q=questions[question];$('question').textContent=q.text;$('choices').replaceChildren();
 for(const [value,label] of q.options){const b=document.createElement('button');b.textContent=label;b.onclick=()=>answer(value);$('choices').append(b);}
}
function begin(){const q=questions[question];$('feature').value=q.feature;started=performance.now();opens=0;switches=0;render();}
function answer(value){
 const q=questions[question];record.questions.push({display:variants[variant].label,question:question+1,feature:q.feature,answer:value,correct:value===q.correct,seconds:(performance.now()-started)/1000,evidence_opens:opens,feature_switches:switches});
 question++;
 if(question===questions.length){question=0;variant++;}
 if(variant===variants.length){$('trial').classList.add('hidden');$('finish').classList.remove('hidden');$('outcome').textContent='課題達成 '+record.questions.filter(x=>x.correct).length+'/'+record.questions.length+'。表示X・Yのどちらを選ぶか、理由と一緒に記録してください。';}
 else begin();
}
$('feature').onchange=()=>{switches++;render()};
$('start').onclick=()=>{record.started_at=new Date().toISOString();$('start').classList.add('hidden');$('trial').classList.remove('hidden');begin()};
$('save').onclick=()=>{
 if(!$('choice').value||!$('reason').value.trim()){$('outcome').textContent='選択と理由を入力してください。';return;}
 record.choice=$('choice').value;record.reason=$('reason').value.trim();record.finished_at=new Date().toISOString();
 const url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='mcp-human-interaction.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
</script>
