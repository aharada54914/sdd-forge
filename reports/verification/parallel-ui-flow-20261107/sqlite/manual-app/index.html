<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQLite Task Board</title><style>body{font-family:system-ui;background:#eff3f8;color:#142238;margin:0}main{max-width:680px;margin:60px auto;background:white;padding:32px;border-radius:18px}h1{margin-bottom:8px}p{color:#566579}form{display:flex;gap:12px;margin:28px 0}input{flex:1;min-width:0;padding:12px;border:1px solid #8c9bb1;border-radius:6px}button{padding:10px 18px;border:0;border-radius:6px;background:#2463d4;color:white;cursor:pointer}li{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #ddd}li span{flex:1;overflow-wrap:anywhere}li input{flex:0 0 20px;width:20px;height:20px;padding:0}ul{padding:0}.done{text-decoration:line-through;color:#667}#error{color:#a11}@media(max-width:720px){main{margin:16px;padding:20px}}</style><main><h1>SQLite Task Board</h1><p>小さな仕事を、ひとつずつ。データはSQLiteに保存されます。</p><form><label for="title" hidden>タスク名</label><input id="title" placeholder="新しいタスク" maxlength="200" required aria-label="タスク名"><button>追加</button></form><div id="error" role="alert"></div><ul id="tasks"></ul><p id="empty">タスクはありません</p></main><script>
async function request(path, options={}) {const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(data.error);return data;}
async function render(){const data=await request('/api/tasks');tasks.replaceChildren();empty.hidden=data.length>0;for(const task of data){const li=document.createElement('li');const check=document.createElement('input');check.type='checkbox';check.checked=!!task.done;check.setAttribute('aria-label',task.title+'を完了');check.onchange=()=>act(()=>request('/api/tasks/'+task.id,{method:'PATCH'}));const span=document.createElement('span');span.textContent=task.title;if(task.done)span.className='done';const del=document.createElement('button');del.textContent='削除';del.setAttribute('aria-label',task.title+'を削除');del.onclick=()=>act(()=>request('/api/tasks/'+task.id,{method:'DELETE'}));li.append(check,span,del);tasks.append(li);}}
async function act(fn){try{error.textContent='';await fn();await render();}catch(e){error.textContent=e.message;}}
document.querySelector('form').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#title');act(async()=>{await request('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value})});title.value='';title.focus();});};act(async()=>{});
</script></html>
