<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Board</title>
<style>body{font:18px system-ui;background:#f3f5f8;color:#15263b;max-width:700px;margin:64px auto;padding:24px}main{background:white;padding:32px;border-radius:20px;box-shadow:0 8px 30px #18354d12}h1{margin-top:0}form{display:flex;gap:12px}input[type=text]{flex:1;min-width:0;padding:12px;border:1px solid #b9c7d8;border-radius:8px}button{background:#235ac9;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}li{display:flex;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid #eee}li span{flex:1}li.done span{text-decoration:line-through;color:#667}ul{padding:0}small{color:#64748b}#error{color:#b21f32}</style>
<main><small>LOCAL WORKSPACE · JSON STORAGE</small><h1>タスクボード</h1><p>今日の作業を整理しましょう。</p><form id="form"><input id="title" aria-label="タスク名" type="text" maxlength="200" required placeholder="新しいタスク"><button>追加</button></form><p id="error" role="alert"></p><ul id="tasks"></ul><p id="empty">タスクはありません</p></main>
<script>
const error=document.querySelector('#error');
async function request(path,body){const response=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const value=await response.json();if(!response.ok)throw Error(value.error);return value;}
function render(tasks){document.querySelector('#tasks').replaceChildren();document.querySelector('#empty').hidden=tasks.length>0;for(const task of tasks){const li=document.createElement('li');li.className=task.done?'done':'';const check=document.createElement('input');check.type='checkbox';check.checked=task.done;check.setAttribute('aria-label',task.title+'を完了');check.onchange=()=>update('/api/toggle',{id:task.id});const text=document.createElement('span');text.textContent=task.title;const del=document.createElement('button');del.textContent='削除';del.setAttribute('aria-label',task.title+'を削除');del.onclick=()=>update('/api/delete',{id:task.id});li.append(check,text,del);document.querySelector('#tasks').append(li);}}
async function update(path,body){try{error.textContent='';render(await request(path,body));return true;}catch(e){error.textContent=e.message;return false;}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#title');if(await update('/api/tasks',{title:input.value}))input.value='';};update('/api/tasks');
</script></html>
