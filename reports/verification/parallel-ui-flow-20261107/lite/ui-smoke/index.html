<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>タスクボード</title><style>body{font:18px system-ui;background:#eef3f7;color:#163047;max-width:700px;margin:60px auto;padding:24px}main{background:white;padding:32px;border-radius:18px}input,button{font:inherit;padding:10px}button{cursor:pointer}li{display:flex;gap:12px;padding:14px 0;align-items:center}li span{flex:1}li.done span{text-decoration:line-through;color:#777}h1{margin-top:0}</style><main><h1>タスクボード</h1><p>今日やることを、ひとつずつ。</p><form><label for="task">新しいタスク</label><br><input id="task" required maxlength="200"><button>追加</button></form><p id="count" aria-live="polite"></p><ul></ul></main><script>const key='lite-task-board-v1';let tasks=JSON.parse(localStorage.getItem(key)||'[]');const list=document.querySelector('ul');function render(){list.replaceChildren();tasks.forEach((t,i)=>{const li=document.createElement('li');li.className=t.done?'done':'';const c=document.createElement('input');c.type='checkbox';c.checked=t.done;c.setAttribute('aria-label',t.title+'を完了');c.onchange=()=>{t.done=c.checked;save()};const s=document.createElement('span');s.textContent=t.title;const d=document.createElement('button');d.textContent='削除';d.setAttribute('aria-label',t.title+'を削除');d.onclick=()=>{tasks.splice(i,1);save()};li.append(c,s,d);list.append(li)});document.querySelector('#count').textContent=tasks.filter(t=>!t.done).length+'件の未完了タスク'}function save(){localStorage.setItem(key,JSON.stringify(tasks));render()}document.querySelector('form').onsubmit=e=>{e.preventDefault();const i=document.querySelector('#task'),title=i.value.trim();if(title){tasks.push({title,done:false});save();i.value=''}};render();</script></html>
