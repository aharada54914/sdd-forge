<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task board</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">A little room to focus</p><h1>Task board</h1><p>Your next steps, one at a time.</p></header>
    <form id="add-form" novalidate>
      <label for="title">New task</label>
      <div class="entry"><input id="title" name="title" autocomplete="off" aria-describedby="input-error"><button type="submit">Add task</button></div>
      <p id="input-error" role="alert"></p>
    </form>
    <p id="storage-warning" role="status" hidden></p>
    <section aria-label="Tasks">
      <p id="summary" aria-live="polite"></p>
      <p id="empty">Nothing on your list yet. Add your first task above.</p>
      <ul id="tasks"></ul>
    </section>
    <footer>Saved in this browser · A list just for you</footer>
  </main>
</body>
</html>
