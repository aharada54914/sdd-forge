summary: "T-001 の QG cycle 上限 (3) 到達 (seq 0660, 0 Critical / 2 Major)。リゾルバ実装そのものは健全と独立再現済みで、2 件とも Done-When 4 の「番人」側の欠陥。是正は未着手のため、修正 + fresh session での再ゲート 1 サイクルが必要"
problem: |
  cycle 3 (seq 0660, attempt 2) は Major 2 件で NEEDS_WORK。両方とも
  Done-When 4 を守るはずのアサーションが実質的に何も守っていないという
  同一クラスの欠陥で、成果物そのものの欠陥ではない。

  **実装は健全 (これを先に明記する)。** 評価者はリポジトリ側の fixture を
  再利用せず自前の scratch fixture を構築し、Done-When 1 / 3 のセマンティクス
  を全件一次再現した: `**` のゼロセグメント/複数セグメント照合、`*` の単一
  セグメント限定、バイト単位の case sensitivity、OVERLAP が両オーナーを
  列挙すること、exclude 由来の UNOWNED が `excluded_match` タグを持ち通常の
  UNOWNED は持たないこと、bounded な `shared_paths` が SHARED_BOUNDED を
  生んで OVERLAP を抑止すること。fail-closed 経路も全て発火した (`?` と
  `[abc]` の拒否、空 `paths.include` の load 時拒否、`shared_paths` の
  both/neither 拒否、NFC 衝突の拒否、バックスラッシュ記法のスラッシュ形
  照合、NFD 生パスのバイト保存と `normalized_path` の NFC 化、raw ordinal
  ソート順)。completion-faking なし。両ランタイムで 66 passed / 0 failed
  (本チケット起票時にも再測定し、bash / pwsh とも 66/0 を確認済み)。
  Done-When 2, 5 と 6 の RED 半分も独立に充足。ADR-0027 は Accepted で
  索引済み。

  1. **TEST-045.5 が Done-When 4 の名指しする成果物を見ていない。**
     `component-path-resolver.tests.sh:967-974` / `.ps1:851-860` が検証して
     いるのは `reports/implementation/epic-191-a3-path-ownership/drafts/MANIFEST.sha256`
     であって、Done-When 4 が名指しする `human-copy/` 側の成果物ではない。
     これが後付けの retarget であることはリポジトリ内に証拠がある:
     `verification/T-001/component-path-resolver.RED.log:58` に初出時の
     アサーション文面 "expected a .github/workflows/test.yml entry in
     .../human-copy/MANIFEST.sha256" が残っており、
     `git log -S'reports/implementation/epic-191-a3-path-ownership/drafts' -- tests/component-path-resolver.tests.sh`
     は `01df4cbd` 1 件のみを返す。retarget を正当化していた書き込み禁止は
     既に失効している (実候補は `2e1a9fcf` 以降実在し、
     `human-copy/MANIFEST-NOTES.md:47-51` が drafts 迂回は "never necessary"
     で `drafts/MANIFEST.sha256` は superseded と記録している)。
     決定的な点として `grep -n human-copy` を両スイートに対して実行すると
     一致ゼロ (本チケット起票時に再実行し確認)。つまり staged candidate や
     その manifest 行を削除しても、このタスクのテストは何一つ気付かない。

  2. **TEST-045.6 は構造上 fail できない。**
     `component-path-resolver.tests.sh:976-980` / `.ps1:862-867` は live の
     workflow が byte-unchanged であることを証明すると称しているが、実体は
     `git diff --quiet -- .github/workflows/test.yml`、すなわち working tree
     と HEAD の比較でしかない。clean checkout では自明に green で、commit
     済みの変更は原理的に観測できない。
     論証ではなく実測: 本チケット起票時に当該ファイルの内容ハッシュを
     revision ごとに再計算したところ `41881071~1` / `41881071` / `f3ba917a`
     で `3fe8466c…`、`c1db8b57~1` で `8beba70c…`、`c1db8b57` / HEAD で
     `1cb977e5…` と 3 つの異なる値をとる。ファイルは確かに 2 度動いており、
     その間 TEST-045.6 は一度も色を変えていない。
     なお T-001.md が以前「TEST-045.6 は apply に反応する唯一のアサーション」
     と書いた点は誤りで、テスト修正と併せて当該記述も訂正が要る。

  Minor 3 件も未処理: (a) `T-001.md:322-324` と `:345-349` が staged workflow
  candidate と manifest を "are not delivered" と書いたままで、同じ report の
  2026-08-11 Outputs addendum およびツリーの実態と矛盾する (今回 Outputs
  節だけが更新され、この 2 箇所が漏れた)。(b)
  `verification/T-001/unblock-schema.GREEN.md:12-13,30-33` は 59/59 と 29/29
  を記録しているが現ツリーは 66/66 で、しかも Outputs addendum が
  "GREEN artifacts" と呼ぶ 2 ファイルは末尾が "36 passed, 1 failed"
  (attempt 1 の designed-red TEST-011.3)。`a4ee7770` と `0b2a18dd` が追加した
  7 アサーションには永続化された green ログが存在しない。(c) Done-When 5 の
  AC-049 grep セルフチェックに対応する実装アサーションが両スイートに無く、
  評価者は git で直接実体を確認して代替した。
proposed_resolution: |
  2 件の Major はいずれも agent 実施可能で、範囲も狭い。両方とも
  Done-When 4 の番人という同一箇所にある。

  1. TEST-045.5 を
     `specs/epic-191-a3-path-ownership/human-copy/.github/workflows/test.yml`
     を `human-copy/MANIFEST.sha256` に対して検証する形へ戻す。
  2. TEST-045.6 の working-tree `git diff --quiet` を、このタスク自身の
     commit 範囲に対する検査へ置き換える (T-001 のために作られた commit が
     `git log --format=%H -- .github/workflows/test.yml` に現れないこと)。
     現状 `.github/workflows/test.yml` に触れた枝上の commit は人間の
     `c1db8b57` だけであり、T-001 の 4 commit (`41881071`, `f3ba917a`,
     `01df4cbd`, `18624e54`) はいずれも触れていない。
  3. あわせて T-001.md の Minor (a) 2 箇所と、TEST-045.6 に関する誤った
     自己記述を訂正する。Minor (b) は 7 アサーション分の green ログを
     実走で取り直す (手書き修正ではなく再実行)。

  **重要 (共有ファイル):** `tests/component-path-resolver.tests.sh` と
  `.ps1` は共有ファイルで、**T-005 が既に `Status: Done`** かつ
  `T-005.md` / `T-005-remedy-1.md` の Outputs で両方を hash 宣言している。
  編集すると Done タスクの証跡束縛が壊れるため、RT-20260809-001 の
  共有ファイル慣例に従い、**同一パス内で両テーブルを必ず更新すること**。
  T-005 の Status と Approval には触れないこと。

  修正後、fresh session で T-001 の evaluator を 1 サイクル予約・起動する。
  予約は必ず
  `validate-review-context-set.sh <manifest> <repo-root> --reserve`
  に行わせること (台帳への手書き追記は禁止。契約が通らない限り予約が
  存在しない状態を保つため)。attempt を上げて round 1 から回すこと。

  確認すべき点:
  - TEST-045.5 が `human-copy/` 側の実候補を見ており、staged candidate または
    その manifest 行を削除すると落ちること (変異で非空虚性を実証する)
  - TEST-045.6 が commit 範囲ベースになっており、`.github/workflows/test.yml`
    を触る T-001 commit を捏造すると落ちること
  - 両スイートが両ランタイムで 66/0 を維持すること
  - T-005.md / T-005-remedy-1.md の Outputs が新ハッシュに追随していること

  **重要 (運用):** ゲート実行中に同じワークツリーへ書き込むエージェントを
  走らせないこと。RT-20260810-001 / RT-20260810-002 が記録しているとおり、
  並行書き込みによりゲート実行中にハッシュ束縛が壊れ、T-001 と T-005 で
  Major を誘発した実績がある。本タスクは特に共有テストファイルを触るため
  影響範囲が広い。
