  - "Add a canonical '## Outputs' table to T-006.md (the legacy bullets only parse because WFI-038 taught the boundary that grammar)"
  - "Re-gate with a manifest naming reports/quality-gate/20260821T081500Z.md as gate_report_declaration so the drifted suite and validator become readable, then verify Done-When 1-3 behaviorally"
