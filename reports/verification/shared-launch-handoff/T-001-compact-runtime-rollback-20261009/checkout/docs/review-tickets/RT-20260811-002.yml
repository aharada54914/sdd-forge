human_ruling_2:
  date: 2026-08-11
  ruling: |
    Given after the seq0680 gate report presented the three measured
    options: the human chose option (b) DIRECTLY - amend the sibling
    epics' pins so the shared-file snapshot is evicted from per-epic
    bundles entirely (the class fix), explicitly accepting that A2's
    completion waits on it. Quality rationale as ruled: a per-epic staged
    snapshot of a repo-shared file (.github/workflows/test.yml) is
    structurally doomed to go stale and become a deletion hazard - three
    such surfaces were found in the week of 2026-08-11; option (a)
    refresh-to-live is evaluator-measured safe today but rots again as CI
    grows; evicting the snapshot removes the class, not the instance. The
    cross-epic edits are human-authorized under this ruling, and
    quality-gate cycle 8 runs on this same explicit direction.
