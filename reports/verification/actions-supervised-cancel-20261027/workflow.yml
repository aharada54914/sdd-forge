name: Supervised cancel observation
on:
  push:
    branches: [verify/issue620-factory-adapter-20261027]
permissions:
  contents: read
jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8a1f7de2cca27bb6374b43f2867cff756e44fe8d
          persist-credentials: false
      - name: Run supervised process tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/supervised-proof"
          cat > "$RUNNER_TEMP/supervised-proof/child.py" <<'PY'
          import json,os,pathlib,subprocess,sys,time
          root=pathlib.Path(sys.argv[1]);child=subprocess.Popen([sys.executable,'-c','import time; time.sleep(300)'],start_new_session=True)
          (root/'pids.json').write_text(json.dumps({'parent':os.getpid(),'child':child.pid}))
          print('SUPERVISED_TREE_READY',flush=True)
          while True: time.sleep(1)
          PY
          exec 3>"$RUNNER_TEMP/supervised-proof/supervisor.json"
          python3 plugins/sdd-bootstrap/scripts/project-skill-process.py --status-fd 3 --timeout 240 -- python3 "$RUNNER_TEMP/supervised-proof/child.py" "$RUNNER_TEMP/supervised-proof"
      - name: Observe supervised cleanup
        if: ${{ cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'supervised-proof'
          result={'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'sha':os.environ['GITHUB_SHA'],'fixture_source':'8a1f7de2cca27bb6374b43f2867cff756e44fe8d'}
          try: result['pids']=json.loads((root/'pids.json').read_text())
          except (OSError,ValueError): result['pids']=None
          try: result['supervisor']=json.loads((root/'supervisor.json').read_text())
          except (OSError,ValueError): result['supervisor']=None
          def active(pid):
              try:
                  text=pathlib.Path('/proc',str(pid),'stat').read_text()
                  return text.rsplit(')',1)[1].split()[0] != 'Z'
              except (OSError,IndexError): return False
          if result['pids']:
              result['parent_active']=active(result['pids']['parent']);result['child_active']=active(result['pids']['child'])
          (root/'after.json').write_text(json.dumps(result,indent=2));print(json.dumps(result),flush=True)
          PY
      - name: Publish observation
        if: ${{ cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supervised-cancel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supervised-proof/after.json
          if-no-files-found: error
          retention-days: 7
