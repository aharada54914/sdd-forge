<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日のタスク</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>今日のタスク</h1>
      <p>今日やることを、ひとつずつ。</p>
    </header>
    <form id="task-form" novalidate>
      <label for="title">タスクのタイトル</label>
      <div class="form-controls">
        <input id="title" name="title" type="text" autocomplete="off" aria-describedby="title-hint error" disabled>
        <button id="add" type="submit" disabled>追加</button>
      </div>
      <p id="title-hint" class="hint">1〜200文字で入力してください</p>
    </form>
    <div class="feedback">
      <p id="status" role="status" aria-live="polite" aria-atomic="true">読み込み中…</p>
      <p id="error" role="alert" aria-atomic="true"></p>
      <button id="retry" type="button" hidden>再読み込み</button>
    </div>
    <section aria-label="タスク一覧" id="tasks" aria-busy="true">
      <p id="empty" aria-live="polite" hidden>タスクはまだありません</p>
      <ul id="task-list"></ul>
    </section>
    <noscript>タスクを使うには、ブラウザーの JavaScript を有効にしてください。</noscript>
  </main>
</body>
</html>
