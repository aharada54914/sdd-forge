<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>今日のタスク | Task Board</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head>
<body><main>
<header><p class="brand">Task Board</p><h1>今日のタスク</h1><p>今日やることを整理して、やるべきタスクを管理しましょう。</p></header>
<div class="stats" aria-label="タスクの集計"><div>すべて<strong id="total">0</strong></div><div>未完了<strong id="active-count">0</strong></div><div>完了<strong id="completed-count">0</strong></div></div>
<form novalidate><label for="title">新しいタスク</label><div class="entry"><input id="title" name="title" placeholder="タスクを入力" autocomplete="off" aria-describedby="validation"><button type="submit">追加</button></div><p id="validation" role="alert"></p></form>
<p id="storage-notice" role="status"></p>
<section aria-labelledby="active-heading"><h2 id="active-heading">未完了のタスク</h2><ul id="active"></ul></section>
<section aria-labelledby="completed-heading"><h2 id="completed-heading">完了したタスク</h2><ul id="completed"></ul></section>
</main></body></html>
