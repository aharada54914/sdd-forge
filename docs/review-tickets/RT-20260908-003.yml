resolved_design_question: >-
  Existing validate-approval-sidecar.py accepts only project-context and
  provider-bindings schema families (lines 153-158); it cannot authorize this
  recovery record. Decide whether to extend the trusted signed-approval
  contract with a dedicated review-recovery purpose, rather than accepting
  a caller-authored approval boolean or weakening normal reset. The existing
  scope approval remains valid; this is a newly identified security-contract
  decision, not a request to repeat that scope approval.
human_decision: >-
  On 2026-09-08 the user additionally explicitly authorized:
  既存の署名付き承認機構を拡張し、対象証跡のハッシュと次の試行番号を限定した「復旧専用承認」を追加してよい
  This resolves the dedicated signed recovery-purpose design question above.
  The file scope includes the existing signer/validator, a dedicated recovery
  request contract and its regression suite. Authorization logic stays inside
  the already protected validator, not an unregistered helper. Shell
  prechecks must invoke the same verifier, not divergent authorization logic.
  Preserve signature verification and registered-approver checks; bind the
  complete source manifest and immediately next attempt. This authorization
  is not itself a generated signed sidecar or a successful recovery execution.
  On 2026-09-08 the user explicitly authorized: 旧記録を保持し、証跡修復用チケットの作成・正式な再開手順の修正と検証まで対応範囲を拡張してよい
  This covers repair-ticket creation and formal recovery procedure repair and
  verification, not weakening checks, rewriting historical evidence, or
  declaring old failures passed. Stop any operation denied by protected-file
  enforcement; do not retry through an alternate wrapper, copy, or path.
