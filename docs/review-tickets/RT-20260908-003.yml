summary: "Preserve invalid historical review evidence and provide an explicit audited restart"
problem: |
  A8 attempt 4 round 2 integrated-summary.json lacks generated_at. Its bytes
  are pinned by reviewer B's inputs, so modifying the old summary would
  misrepresent what that reviewer received. Attempt 4 round 3 precheck
  correctly rejects this malformed contract (tool eddd7a, exit 1).
  The current reset path requires a valid terminal PASS or BLOCKED contract;
  this malformed NEEDS_WORK round cannot legally advance or reset.
  Issue #61 is closed, so its temporary manual-precheck fallback is unavailable.
  Evidence lives in /Users/jrmag/.local/share/sdd-forge-a8-verify-20260905.
  Old summary SHA256: 66c584c43a843060b9ae44c286fa57d97b28ba1ee3a3dffe8829afd250c92ac6.
  Old precheck SHA256: f8c88d794fd7920a8dbbdecb2c835235434ac5f368ca2007b03c5276946503c6.
expected_fix:
  - "Define and review an explicit recovery transition; do not relax normal continuation/reset validation or manufacture a terminal verdict."
  - "Retain all prior round files and reviewer identity reservations byte-for-byte. An append-only repair record identifies their hashes, the structural defect, human authorization, and the new attempt."
  - "Restart only at a fresh next attempt round 1, with Pending status, fresh independent reviewer identities, complete manifests, and all ordinary acceptance checks. Historical findings remain unresolved until fresh review proves otherwise."
  - "Bind recovery authorization to the exact feature, source attempt/round, source evidence manifest, destination attempt, and ticket. Reject replay, missing authorization, hash mismatch, path escape, and arbitrary skipping of attempts."
  - "Validate summary schema before sending it to reviewer B to prevent recurrence; never retrospectively insert a fabricated timestamp."
  - "Determine all persisted-state consumers before implementation and keep Bash/PowerShell acceptance equivalent. Preserve existing checks and artifact-freeze rules."
verification:
  - "Retain the original failed transition and prove original historical hashes are unchanged before and after recovery."
  - "Add regressions for missing generated_at, valid ordinary continuation/reset, authorized recovery, unauthorized recovery, modified evidence, replay, incorrect feature/counters, and unsafe paths."
  - "Run related review-loop and workflow-state suites on supported shells; do not count skipped native-platform checks as success."
  - "Require independent review of the recovery boundary and a successful automated precheck before starting fresh specification review. No PASS or Done inferred from successful recovery alone."
references:
