  installers materialize runtime only for the current selection, then replace
  the entire installation directory. Azure followed by AWS-only or the default
  selection leaves the previous Azure plugin without runtime, while prior host
  registrations remain. Its documented explicit runtime path fails with
  SHARED_RUNTIME_UNAVAILABLE. Fresh-destination tests do not cover this case.
expected_fix:
  - Commit actual failing sequential-selection tests and field/counterpart preflight before product edits.
  - Preserve or regenerate prior installed provider runtime payloads during later selection updates.
  - Cover both orders and default/non-cloud subsequent selections in real Bash and PowerShell installers.
  - Verify both prior and newly selected installed CLIs, protected registry/schema/module integrity and denied unauthorized writes after each update.
  - Keep default registration opt-in semantics, source/runtime consistency, safe staging and retained-dependency uninstall behavior.
  - Preserve canonical implementation and cycle1 report; use a separate repair report and fresh independent review.
