problem: |
  QG evaluator (seq 0829, VERDICT NEEDS_WORK, report
  reports/quality-gate/20260821T080000Z.md) accepted one Critical, eight
  Majors and three Minors - the worst result of the 2026-08-21 sweep.

  Critical: verification/T-007/green.log backs all ten exit-0 rows of the
  Tests table and has drifted (declared 1b9d45cc..., measured 8268e280...).
  Nothing else owns that path - it is T-007's own verification directory - so
  this is not collateral drift. With five of six declared artifacts drifted
  and zero readable, the evidence base collapses to calibration ladder item 5,
  which never supports PASS by itself.

  Major 1 (structural, blocks every future cycle): outputs are declared under
  "## Attempt-3 outputs" / "## Attempt-2 outputs". Measured: grep -c for the
  canonical "## Outputs" heading = 0 and for the ratified legacy
  "## Output Paths And Hashes" = 0. The WFI-036/038 declaration reader
  therefore sees zero declared outputs, so T-007 cannot authorize its own
  deliverables into ANY manifest until the heading is fixed.

  Major 2 (completion-faking shape): attempt 3's entire remediation was
  de-registering tests/rollback-1.5.0.tests.sh from tests/run-all.sh so
  TEST-005 turns green. The exculpatory claim ("only the T-008 registration
  line was removed") is the claim most needing verification and has none -
  run-all.sh is unauthorized and drifted. The sequencing rationale is
  coherent and impropriety is NOT asserted; what is recorded is that the most
  fake-prone claim in the report has zero available evidence. run-all.sh is
  also outside T-007's Planned Files and inside T-008's Done-When.

  Remaining Majors: isolation mode says fresh-agent / fallback none while the
  text three lines later describes an orchestrator finalizing a file-backed
  handoff after a quota interruption (the same-session-file-reload path,
  which must record a fallback marker and reload evidence hash); REQ-011's
  release surface is ~21 of ~23 paths undeclared (zero manifests, zero
  marketplaces, no README, no CHANGELOG); "Failure class:
  acceptance-test-not-green" is not in the closed enum {test, lint,
  typecheck, build, review-major, review-critical}; the report says "Ready
  for independent review" while tasks.md already says Implementation
  Complete; attempt 3's own green.log is undeclared and there is no attempt-1
  section at all; and .github/workflows/test.yml was edited with zero CI
  evidence though design.md conditions the release on seven passing jobs.

  The escalation ARITHMETIC does cohere and is not disputed - only the
  off-enum label is wrong.
