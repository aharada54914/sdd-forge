  task: T-002
summary: "Windows unittest discovery and the Python test retirement classifier disagree on letter case"
problem: |
  Python unittest uses fnmatch for the default discovery pattern. On Windows its
  path comparison folds case. The classifier applies a case-sensitive prefix and
  extension on all hosts, so it can miss a discoverable module in the approval check.
expected_fix:
  - Match the host's supported unittest discovery semantics on Windows and POSIX.
  - Compare harmless normal and mixed-case module names against native unittest discovery and the public approval check on both platforms.
