summary: "Do not suppress golden comparison on mixed environment and content failures"
problem: |
  shell-runner.ts:145-162 returns checkout-dependent causes when all own
  failures are bundle summaries and at least one orphaned-commit detail
  exists, but ignores other bundle detail failures. A same-bundle artifact
  hash mismatch plus orphaned commit therefore suppresses the strict
  comparison, contrary to its documented contract at lines 138-143.
  A direct invocation against freshly compiled current source reproduced
  this false suppression. Existing seven golden/control tests still pass.
expected_fix:
  - "Keep strict comparison whenever any non-environment bundle failure detail is present; preserve the existing environment-only exception and diagnostics."
  - "Add mixed-detail negative controls, including same-bundle and separate-bundle failures and both detail orders, retaining all existing controls."
  - "Do not change product parser, historical evidence, snapshots, review verdicts or CI requirements. The 2026-09-08 scope extension permits only the bounded T-002 reopening contract and its two workflow-state consumers."
  - "Keep the legacy feature-wide status list Done-only. Add an exact schema-bound T-002 status override allowing only Implementation Complete and Done; require a unique canonical task ID and Approved approval. Reject other tasks, malformed or duplicate identity, other states, and registry broadening."
verification:
  - "First record new negative controls failing on current source; then require them and the existing controls to pass."
  - "Run TypeScript compilation and the live and recorded golden tests; distinguish local macOS results from native Windows."
  - "Run independent review and the applicable formal gate before resolving this ticket; carry the correction into integration rather than restoring older branch tests."
  - "Run real Bash and PowerShell workflow-state consumers against positive and refusal fixtures, including LF/CRLF and case variants; preserve existing registry/workflow-state suites. Complete formal review before integration."
