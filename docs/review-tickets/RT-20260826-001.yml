summary: >-
  AC-006 says the evidence-bundle checker "validates" the high-risk
  provenance fields, but design.md:178 enumerates its required set as only
  spec_revision, build_env and review_verdict.verdict == PASS, so removing
  checks, required_workflow or builder from a conforming bundle exits 0 on
  both twins
problem: |
  Found by the cycle-5 QG evaluator for risk-adaptive-layer T-006 (seq 0854,
  report reports/quality-gate/20260826T021500Z.md), classified Minor and
  explicitly referred to a review ticket rather than fixed, because the code
  matches the ratified design text and changing it is a specification
  decision.

  Measured (2026-08-26), 12-case tamper matrix against a conforming
  high-risk bundle on a clean tree, run on BOTH runtimes. Pristine bundle
  exits 0 on both. Correctly REJECTED: spec_revision empty, spec_revision
  missing, build_env missing, review_verdict missing, verdict != PASS, risk
  emptied, risk mismatched. Wrongly ACCEPTED (exit 0 on both twins):

    - checks removed
    - checks emptied
    - required_workflow removed
    - builder removed

  Parity is intact, so this is not a twin-specific hole and not a
  cross-runtime defect. It is a disagreement between two approved documents:

    - requirements.md:41 names per-check command/exit_code/timestamps,
      required_workflow, and builder identity as REQUIRED high-risk
      provenance, and AC-006 says the checker "validates them";
    - design.md:178 enumerates the checker's required set as exactly
      spec_revision, build_env and review_verdict.verdict == PASS.

  The implementation follows design.md. So the gate is weaker than the
  requirement a reader of requirements.md would expect: a high-risk bundle
  can ship with no per-check telemetry at all and pass.

  Consequence if left: REQ-006's provenance guarantee is advisory for four
  of its named fields, and the next reader of AC-006 will reasonably assume
  coverage that does not exist. Note this is a coverage gap, not a live
  bypass - nothing currently emits such a bundle, because both generators
  populate all four fields.
expected_fix: |
  REWRITTEN 2026-08-26 after measuring where the named fields actually live.
  The original (a)/(b) framing was wrong: it assumed the per-check provenance
  belongs in the bundle. It does not, and the measurement changes the answer.

  Measured on this repository:
    - 197 evidence bundles, 107 of them risk: high.
    - required_workflow and builder are present in ALL of them (0 missing), so
      two of AC-006's three named elements are already satisfied.
    - checks is absent from 103 of the 107. It is absent because a bundle does
      not carry checks at all - the per-check record lives in the verification
      CONTRACT, which the bundle names in its verification_contract field.
    - That field is a BARE PATH with no hash. Example shape:
        "verification_contract": "specs/<feature>/verification/T-000.contract.json"

  So a straight widening of the bundle checker would not deliver the guarantee
  even if it passed: the contract it points at is not pinned, and can be
  replaced after the bundle is generated with nothing detecting it. Fix the
  unhashed link first, then the content, then the wording. In that order.

  Stage 1 - pin the link (highest value, zero corpus cost).
    Make verification_contract carry a path AND a sha256, and have the bundle
    checker verify the referenced contract's live bytes against it, on both
    twins. New bundles only; existing bundles keep the bare-path form under the
    grandfathering rule below. Without this stage the other two are decorative.

  Stage 2 - require the per-check record where it lives (the contract).
    WFI-046 made command / exit_code / started_at / finished_at format-checked
    WHEN PRESENT and explicitly grandfathers absence - T-006.ps.7a pins that
    behaviour. Promote them to REQUIRED for contracts under a declared schema
    version, leaving schema-less contracts on today's rule, so the requirement
    is fail-closed forward and costs no migration backward. Add a tamper
    fixture per field on each runtime; today no fixture enters this path.

  Stage 3 - make AC-006 say what is actually enforced.
    Amend requirements.md:41 and AC-006 to state that the checker validates
    spec_revision, build_env and review_verdict directly, and validates the
    per-check provenance BY REFERENCE to a hash-pinned verification contract.
    Amend design.md:178 to match. This closes the document disagreement by
    making both documents describe the delivered chain, rather than by
    deleting a guarantee (the original option (b)) or by promising one the
    unhashed link cannot support (the original option (a)).

  Human decision still required before stage 1: confirm this ordering, and
  confirm that grandfathering bare-path bundles is acceptable rather than
  requiring a corpus re-generation.

