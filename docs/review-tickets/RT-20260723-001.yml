resolution: |
  2026-07-23: Remedied in plugins/sdd-quality-loop/scripts/validate-capability-registry.py:
  check_c_unregistered_script now tracks implementation_ref resolutions as
  real-path -> [gate ids] instead of a bare set, and emits a new
  `gate-implementation-collision` diagnostic (naming every colliding gate
  id) whenever two or more gates[] entries resolve to the identical real
  path -- closing the AC-016 gap the evaluator's crafted registry
  demonstrated (exit 0 where the spec requires failure).
  Added the three missing TEST-016 assertions to both
  tests/validate-capability-registry.tests.{sh,ps1}: (1) a gate naming a
  .sh wrapper instead of its .py master (the master correctly shows
  unregistered-script), (2) a gate referencing a symlinked entry point
  (the real master correctly registers, proving symlink resolution),
  (3) the new collision diagnostic (two new fixtures:
  validate-registry-identity-{non-py-ref,symlink,collision}.json, plus a
  check-registered-symlink.py symlink added to the existing
  identity-bidirectional-repo fixture).
  TDD evidence: reran the ORIGINAL (pre-remedy, commit 2e79289) validator
  against the new assertions first -- RED showed exactly the reported bug
  (both collision assertions fail; the non-py-ref and symlink assertions
  already passed even pre-remedy, since only collision detection was
  actually broken) -- then GREEN after the fix, 27/27 both runtimes.
  Evidence: specs/epic-190-a2-capability-registry/verification/T-004/
  {red,green}-{sh,ps1}-remedy.log.
  Minor findings 3-5 from the attempt-1 report were not actioned this
  round per the evaluator's own instruction (recorded only).

  2026-07-23: Re-evaluated (attempt 2, run
  RUN-epic-190-a2-capability-registry-qg-T-004-a2-seq0348, report
  reports/quality-gate/2026-07-23T041500Z-epic-190-a2-capability-registry-T-004-attempt2.md).
  VERDICT: PASS -- both Major findings above confirmed resolved (the
  evaluator independently reproduced the pre-remedy silent-pass bug
  against unmodified commit 2e79289 as a differential proof, then
  confirmed the remedy fires correctly on independently-crafted
  adversarial registries, not only the shipped fixture). Zero Critical,
  zero Major, three new Minor findings (all recorded, non-blocking):
  (1) the check-registered-symlink.py fixture was named only in
  T-004.md's Remedy prose, not as its own Outputs-table row -- fixed
  post-gate as a report-completeness cleanup (added the row); (2)
  design.md's diagnostic-ID table does not separately enumerate
  gate-implementation-collision -- not a conformance defect per the
  evaluator (the behavior is fully specified in prose elsewhere; record
  only, no fix); (3) the seq0348 review-context manifest omitted this
  ticket file even though T-004.md's Outputs table declares it -- a
  manifest-construction observation outside T-004's scope, not actioned.
  Attempt-1's Minor findings 3-5 were confirmed by the attempt-2
  evaluator to remain correctly out of the remedy's scope.
