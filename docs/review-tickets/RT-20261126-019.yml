summary: "Path normalization changes the identity of literal Git paths during test classification"
problem: |
  A leading space on a directory name and a literal POSIX backslash in a file name are
  significant in Git. Trimming and converting backslashes can make ordinary source paths
  appear to be in a test directory, causing a spurious retirement approval requirement.
expected_fix:
  - Classify Git-reported path segments using Git path semantics.
  - Compare a true test directory with benign source paths containing literal spaces and POSIX backslashes.
