  1. Refresh .github/workflows/test.yml inside BOTH
     specs/epic-136-phase2-gates/human-copy/ and
     specs/epic-189-a1-project-context/human-copy/ to live bytes
     (a37a3795...), refreshing each bundle's MANIFEST.sha256 workflow digest
     in place (no line added, removed, or reordered - the same technique
     36339788 proved for the six guard files), OR record here the owners'
     explicit apply-ordering decision that makes the stale copies
     un-appliable. Either way the silent 18-step deletion path must be
     closed before any further bundle apply.
  2. Re-run the apply rehearsal with the safety property extended to every
     manifest target (byte or step-set comparison of the workflow included)
     and persist the new transcript; retire cycle5-apply-rehearsal.log's
     arrays-only all-clear as the safety evidence of record.
  3. Correct the deterministic-lane-selfcheck characterization in the T-006
     implementation report's next remediation section (new TEST-017-GREEN
     failure caused by the apply; clears on sibling-candidate refresh).
  4. epic-136-phase2-gates' owner decides the WFI-016 phase2_human_copy_targets
     semantics (per-bundle staging inventory vs repository-wide registry) and
     the TEST-013 19-entry pin; that decision is recorded against this ticket
     but is not executed under it.
