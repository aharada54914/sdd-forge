problem: |
  On 2026-09-30 the real validate-capability-registry.sh dispatcher exited 1:
  check-update-migration.py is referenced but absent. The durable-workflow
  capability names this required gate; no executable or CLI/migration/evidence
  contract exists, so an alias, stub, or deleted reference would silently
  change required behavior. Four other diagnostics are distinct additive
  registration omissions: check-component-coverage.py, check-contract.py,
  check-criterion-freeze.py, and check-hook-activation-handshake.py each exists
  as a direct Python gate master but has no gates[] entry. The validator's
  direct-master scan requires exactly one matching entry per file.
  The focused T-002 suite passes 28/28 and the
  nested provider-neutral boundary has an independent scoped review, but
  neither result makes the canonical Registry validation pass. The protected
  registration path refused an agent write; the missing migration-check
  behavior also needs an explicit contract decision rather than an invented
  implementation. This blocks a T-002 Done verdict.
