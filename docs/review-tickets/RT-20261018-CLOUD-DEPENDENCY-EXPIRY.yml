summary: Predecessor freshness deadline does not reach the final native write guard
problem: >-
  Independent reviewer 01a14f74-2211-74f1-9329-f5a77b7a089d found that
  WriteBoundary checks predecessor freshness before submit(credentials), but
  does not carry that deadline into the authorization expiry. Provider callbacks
  perform further validation, native readback/authentication and journal work;
  their last-send guards enforce only consumer expiry. Predecessor evidence can
  expire during callback work while a cloud write remains permitted (AC-006).
expected_fix:
  - Reproduce callback-time predecessor expiry with real provider last-send paths and zero native submissions.
  - Record field/counterpart mismatch preflight and commit genuine Red before the minimal product fix.
  - Carry the predecessor freshness deadline into existing final native admission, preferably by bounding the existing authorization expiry without adding a wire schema.
  - Preserve consumer credential and preview expiry, revocation, audit/replay markers and empty-predecessor behavior.
  - Test Azure preview/deploy and AWS asset/create/execute write callbacks as applicable, with fresh controls and expired-predecessor cases.
  - Run guarded scoped regressions, configured static checks and an actual scoped rollback/reapply.
  - Preserve the canonical T010 implementation report and cycle1 verdict; use a separate fix report and rerun independent quality review.
approval: Existing user approval covers cloud implementation defects and local verification; no scope or prerequisite exception.
