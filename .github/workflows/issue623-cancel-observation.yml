name: Bounded cancel observation
on:
  push:
    branches: [verify/issue620-factory-adapter-20261027]
permissions:
  contents: read
jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Start isolated process tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cancel-proof"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cancel-proof'
          code = '''import os,pathlib,subprocess,sys,time\nroot=pathlib.Path(sys.argv[1])\nchild=subprocess.Popen([sys.executable,"-c","import time; time.sleep(300)"])\n(root/"pids.json").write_text(__import__("json").dumps({"parent":os.getpid(),"child":child.pid}))\nwhile True: time.sleep(1)\n'''
          parent = subprocess.Popen([sys.executable, '-c', code, str(root)], start_new_session=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          for _ in range(100):
              if (root / 'pids.json').exists(): break
              if parent.poll() is not None: raise SystemExit('parent exited before receipt')
              time.sleep(.1)
          else: raise SystemExit('child did not become ready')
          pids=json.loads((root/'pids.json').read_text())
          if pids['parent'] != parent.pid: raise SystemExit('parent mismatch')
          os.kill(pids['parent'],0);os.kill(pids['child'],0)
          (root/'started.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'sha':os.environ['GITHUB_SHA'],'pids':pids,'scope':'detached tree created in a preceding step; not a general cancellation guarantee'}))
          PY
      - name: Publish start receipt before cancellation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cancel-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cancel-proof/started.json
          retention-days: 7
      - name: Hold after confirmed start
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'cancel-proof'/'pids.json').read_text())
          os.kill(p['parent'],0);os.kill(p['child'],0)
          print('Both observed alive; waiting for cancellation',flush=True)
          PY
          sleep 240
      - name: Observe and clean process tree after cancellation
        if: ${{ cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,signal,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'cancel-proof';p=json.loads((root/'pids.json').read_text())
          def alive(pid):
              try: os.kill(pid,0);return True
              except ProcessLookupError: return False
          result={'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'sha':os.environ['GITHUB_SHA'],'pids':p,'parent_alive_before_manual_cleanup':alive(p['parent']),'child_alive_before_manual_cleanup':alive(p['child']),'scope':'pre-cleanup observation, not proof of post-job cleanup'}
          (root/'after.json').write_text(json.dumps(result,indent=2));print(json.dumps(result),flush=True)
          try: os.killpg(p['parent'],signal.SIGTERM)
          except ProcessLookupError: pass
          PY
      - name: Publish cancellation observation
        if: ${{ cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cancel-after-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cancel-proof/after.json
          if-no-files-found: error
          retention-days: 7
