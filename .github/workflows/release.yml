name: Release artifacts (sign + SBOM)

# C-06 / H-04: on a published GitHub Release, build a reproducible source
# tarball, generate a CycloneDX SBOM, publish SHA-256 checksums, and produce a
# sigstore-backed build-provenance attestation for each artifact. Verify with:
#   gh attestation verify sdd-forge-<tag>.tar.gz --repo aharada54914/sdd-forge
#   sha256sum -c SHA256SUMS
# All actions are pinned to commit SHAs (H-04).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package (e.g. v0.9.0). Defaults to the current ref."
        required: false
        type: string
      run_host_smoke:
        description: "Run actual authenticated Codex/Claude/Copilot registration smoke."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ci-green:
    # RT-20260821-004 / design.md:209: releases are conditioned on CI green.
    # This job resolves the released tag's commit and fails closed unless a
    # successful test.yml run exists for exactly that commit. It also closes
    # the workflow_dispatch arbitrary-ref hole: manual dispatches are only
    # allowed from main or a tag ref.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      pkg: ${{ steps.source.outputs.pkg }}
    steps:
      - name: Restrict manual dispatch to main or a tag ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/*) echo "dispatch ref ${GITHUB_REF} allowed" ;;
            *)
              echo "workflow_dispatch is restricted to main or a tag ref; got ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac
      - name: Verify CI success for the release commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          case "$TAG" in
            *[!A-Za-z0-9._-]*|'')
              echo "Refusing tag with unexpected characters: ${TAG}" >&2
              exit 1
              ;;
          esac
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}")" || {
            echo "Tag refs/tags/${TAG} not found - cannot gate a nonexistent release" >&2
            exit 1
          }
          # Peel annotated tags by immutable object ID, never re-read the tag ref.
          for ((depth = 0; depth < 10; depth++)); do
            SHA="$(printf '%s' "$REF_JSON" | jq -r '.object.sha')"
            TYPE="$(printf '%s' "$REF_JSON" | jq -r '.object.type')"
            if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid release object SHA" >&2
              exit 1
            fi
            case "$TYPE" in
              commit) break ;;
              tag) REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}")" ;;
              *) echo "Invalid release ref type" >&2; exit 1 ;;
            esac
          done
          if [ "$TYPE" != commit ]; then
            echo "Release tag nesting exceeds the supported limit" >&2
            exit 1
          fi
          echo "Release commit for ${TAG}: ${SHA}"
          # PR API head_sha names the PR head, but its tests check out a synthetic
          # merge. Admit only events whose tested checkout is this exact source.
          COUNT="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${SHA}&status=success&per_page=100" \
            --paginate | jq -ser --arg sha "$SHA" --arg repo "$GITHUB_REPOSITORY" '
              if type != "array" then error("invalid workflow run pages")
              elif any(.[]; type != "object" or (.workflow_runs | type) != "array") then
                error("invalid workflow run page")
              else [.[].workflow_runs[] |
                if type != "object" then error("invalid workflow run")
                else select(.head_sha == $sha and .status == "completed" and .conclusion == "success" and
                  .path == ".github/workflows/test.yml" and .repository.full_name == $repo and
                  .head_repository.full_name == $repo and
                  ((.event == "push" and .head_branch == "main") or .event == "workflow_dispatch"))
                end] | length
              end')"
          if [[ ! "$COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "No successful source-exact push/main or manual test.yml run for ${SHA} - release is gated on CI green (design.md:209)" >&2
            exit 1
          fi
          echo "CI green confirmed for ${SHA} (${COUNT} source-exact successful run(s))"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "pkg=sdd-forge-${TAG}.tar.gz" >> "$GITHUB_OUTPUT"

  loop-gate:
    needs: ci-green
    # Local release checks need no upload, attestation, or OIDC permissions.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-green.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 26.13 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.0"
      - name: Verify loop checkout
        env:
          RELEASE_SHA: ${{ needs.ci-green.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Run SDD Forge v2 deterministic release suites
        shell: bash
        run: node --test tests/v2-soft-guard.test.mjs tests/v2-spec-drift.test.mjs tests/v2-sdd-core-flow.test.mjs tests/v2-hooks-and-ci.test.mjs tests/v2-real-flows-e2e.test.mjs tests/v2-sdd-doctor.test.mjs tests/v2-software-factory.test.mjs tests/v2-prompts-and-delegation.test.mjs tests/v2-mcp-server.test.mjs tests/v2-antigravity-and-factory.test.mjs tests/node26-ts7-optimization.test.mjs
      - name: Run sdd-doctor health check and POSIX installer checks
        shell: bash
        run: |
          node plugins/sdd-quality-loop/scripts/v2/sdd-doctor.mjs --root . --quiet-info
          bash scripts/check-sdd-structure.sh
          bash -n install.sh && bash -n uninstall.sh
      - name: Verify release tag matches all plugin manifests and CHANGELOG
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.ci-green.outputs.tag }}
        run: |
          node - <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';

          const tag = process.env.RELEASE_TAG || '';
          assert.match(tag, /^v[0-9]+\.[0-9]+\.[0-9]+$/, `Invalid release tag: ${tag}`);
          const expected = tag.slice(1);

          const readme = fs.readFileSync('README.md', 'utf8');
          assert.match(readme, new RegExp(`^v${expected.replace(/\./g, '\\.')}[^0-9]`, 'm'), `README.md must declare v${expected}`);

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          assert.match(changelog, new RegExp(`^## v${expected.replace(/\./g, '\\.')}( |$)`, 'm'), `CHANGELOG.md must contain ## v${expected}`);

          for (const entry of fs.readdirSync('plugins', { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const candidates = [
              path.join('plugins', entry.name, '.antigravity-plugin/plugin.json'),
              path.join('plugins', entry.name, '.claude-plugin/plugin.json'),
              path.join('plugins', entry.name, '.codex-plugin/plugin.json'),
              path.join('plugins', entry.name, '.plugin/plugin.json'),
              path.join('plugins', entry.name, 'gemini-extension.json'),
              path.join('plugins', entry.name, 'gemini/gemini-extension.json'),
            ];
            for (const rel of candidates) {
              if (!fs.existsSync(rel)) continue;
              const data = JSON.parse(fs.readFileSync(rel, 'utf8'));
              assert.equal(data.version, expected, `${rel} version mismatch: ${data.version} != ${expected}`);
            }
          }
          for (const rel of ['.claude-plugin/marketplace.json', '.agents/plugins/marketplace.json']) {
            const data = JSON.parse(fs.readFileSync(rel, 'utf8'));
            for (const plugin of data.plugins || []) {
              if (plugin.version !== undefined) {
                assert.equal(plugin.version, expected, `${rel} (${plugin.name}) version mismatch: ${plugin.version} != ${expected}`);
              }
            }
          }
          const mcpPkg = JSON.parse(fs.readFileSync('mcp/sdd-forge-mcp/package.json', 'utf8'));
          assert.equal(mcpPkg.version, expected, `mcp/sdd-forge-mcp/package.json version mismatch: ${mcpPkg.version} != ${expected}`);
          const mcpServerSrc = fs.readFileSync('mcp/sdd-forge-mcp/src/server.ts', 'utf8');
          assert.match(mcpServerSrc, new RegExp(`version:\\s*"${expected.replace(/\./g, '\\.')}"`), `mcp/sdd-forge-mcp/src/server.ts must declare version ${expected}`);
          const mcpBundle = fs.readFileSync('mcp/sdd-forge-mcp/dist/index.js', 'utf8');
          assert.match(mcpBundle, new RegExp(`version:\\s*"${expected.replace(/\./g, '\\.')}"`), `mcp/sdd-forge-mcp/dist/index.js must be rebuilt for version ${expected}`);
          console.log(`Release version consistency verified for ${tag}.`);
          EOF

  release:
    needs: [ci-green, loop-gate]
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.ci-green.outputs.tag }}
      RELEASE_SHA: ${{ needs.ci-green.outputs.sha }}
      PKG: ${{ needs.ci-green.outputs.pkg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-green.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js 26.13 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.0"

      - name: Build reproducible source tarball with Stage 1 Portable Compile Cache
        run: |
          set -euo pipefail
          # All consumers use the immutable commit admitted by ci-green. A tag
          # moving after that decision must not change the tested/build inputs.
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "Release checkout differs from the CI-verified commit" >&2
            exit 1
          fi
          stage_dir=$(mktemp -d "$RUNNER_TEMP/release-stage.XXXXXX")
          trap 'rm -rf -- "$stage_dir"' EXIT
          git archive --format=tar --prefix="sdd-forge-${TAG}/" "$RELEASE_SHA" | tar -xf - -C "$stage_dir"
          NODE_COMPILE_CACHE_PORTABLE=1 node "$stage_dir/sdd-forge-${TAG}/plugins/sdd-quality-loop/scripts/v2/compile-cache.mjs" \
            --warmup \
            --root "$stage_dir/sdd-forge-${TAG}" \
            --cache-dir "$stage_dir/sdd-forge-${TAG}/.sdd-compile-cache"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -czf "$PKG" -C "$stage_dir" "sdd-forge-${TAG}"
          echo "Built $PKG ($(du -h "$PKG" | cut -f1)) from ${RELEASE_SHA} (with Stage 1 portable compile cache)"

      - name: Release-only real host smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_host_smoke }}
        env:
          SDD_RELEASE_HOST_SMOKE: "1"
        run: ./tests/release-host-smoke.sh

      - name: Generate CycloneDX SBOM (zero-dependency TypeScript, ADR-0055)
        run: |
          set -euo pipefail
          # Scan exactly the bytes being published, including manual tag dispatches.
          snapshot=$(mktemp -d "$RUNNER_TEMP/release-sbom.XXXXXX")
          trap 'rm -rf -- "$snapshot"' EXIT
          tar -xzf "$PKG" -C "$snapshot"
          node .github/scripts/generate-sbom.ts \
            --source-root "$snapshot/sdd-forge-${TAG}" \
            --version="$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --output "sdd-forge-sbom.cdx.json"

      - name: Publish SHA-256 checksums
        run: |
          set -euo pipefail
          sha256sum "$PKG" "sdd-forge-sbom.cdx.json" > SHA256SUMS
          cat SHA256SUMS

      - name: Record immutable build inputs
        run: |
          set -euo pipefail
          node - <<'EOF'
          import fs from 'node:fs';
          const env = process.env;
          const server = env.GITHUB_SERVER_URL;
          const repo = env.GITHUB_REPOSITORY;
          const wfRef = env.GITHUB_WORKFLOW_REF || '';
          const atIdx = wfRef.lastIndexOf('@');
          const workflow = atIdx >= 0 ? wfRef.slice(0, atIdx) : wfRef;
          const workflowRef = atIdx >= 0 ? wfRef.slice(atIdx + 1) : '';
          const repository = `${server}/${repo}`;
          const dependencies = [{ uri: `git+${repository}@${workflowRef}`, digest: { gitCommit: env.GITHUB_WORKFLOW_SHA } }];
          const releaseSource = { uri: `git+${repository}@refs/tags/${env.TAG}`, digest: { gitCommit: env.RELEASE_SHA } };
          if (!dependencies.some((d) => d.uri === releaseSource.uri && d.digest.gitCommit === releaseSource.digest.gitCommit)) {
            dependencies.push(releaseSource);
          }
          const prefix = `${repo}/`;
          const predicate = {
            buildDefinition: {
              buildType: 'https://actions.github.io/buildtypes/workflow/v1',
              externalParameters: {
                workflow: {
                  repository,
                  path: workflow.startsWith(prefix) ? workflow.slice(prefix.length) : workflow,
                  ref: workflowRef,
                },
              },
              internalParameters: {
                github: {
                  event_name: env.GITHUB_EVENT_NAME,
                  repository_id: env.GITHUB_REPOSITORY_ID,
                  repository_owner_id: env.GITHUB_REPOSITORY_OWNER_ID,
                  runner_environment: env.RUNNER_ENVIRONMENT,
                },
              },
              resolvedDependencies: dependencies,
            },
            runDetails: {
              builder: { id: `${server}/${wfRef}` },
              metadata: { invocationId: `${repository}/actions/runs/${env.GITHUB_RUN_ID}/attempts/${env.GITHUB_RUN_ATTEMPT}` },
            },
          };
          fs.writeFileSync('release-provenance.json', `${JSON.stringify(predicate)}\n`, 'utf8');
          EOF

      - name: Attest build provenance (sigstore keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The OIDC signer still identifies the actual workflow invocation;
          # this predicate separately records the checked-out build input.
          # gh --source-ref/--source-digest constrain that signer certificate,
          # so manual main dispatch retains main identity even for another tag.
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: release-provenance.json
          subject-path: |
            ${{ needs.ci-green.outputs.pkg }}
            sdd-forge-sbom.cdx.json

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This is a final equality check, not a new build input. Never publish
          # the admitted bytes under a tag that now names another source commit.
          CURRENT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}")"
          for ((depth = 0; depth < 10; depth++)); do
            CURRENT_SHA="$(printf '%s' "$CURRENT_JSON" | jq -r '.object.sha')"
            CURRENT_TYPE="$(printf '%s' "$CURRENT_JSON" | jq -r '.object.type')"
            if [[ ! "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
            case "$CURRENT_TYPE" in
              commit) break ;;
              tag) CURRENT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${CURRENT_SHA}")" ;;
              *) echo "Invalid release tag object before upload" >&2; exit 1 ;;
            esac
          done
          if [ "$CURRENT_TYPE" != commit ] || [ "$CURRENT_SHA" != "$RELEASE_SHA" ]; then
            echo "Release tag moved after CI admission; refusing asset upload" >&2
            exit 1
          fi
          gh release upload --clobber -- "$TAG" \
            "$PKG" \
            "sdd-forge-sbom.cdx.json" \
            "SHA256SUMS"
