name: SDD Guardrails (v2)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/v2-*", "feat/adr-*"]

  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  guardrails-and-spec-drift:
    if: github.event_name != 'schedule'
    name: Lightweight Guardrails & Spec Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve reviewed commit range
        id: review
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # A forced push can remove the previous tip from all fetched refs.
            git fetch --no-tags origin "$base"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base" HEAD -- 'specs/**/formal/**' tests/fixtures/project-skills/formal-review-reservation \
            tests/v2-formal-gate.test.mjs tests/project-skill-formal.tests.py tests/verify-review-reservation.py \
            plugins/sdd-quality-loop/scripts/v2 plugins/sdd-quality-loop/scripts/validate-review-context-set.sh \
            plugins/sdd-ship/skills/ship/SKILL.md .github/workflows/sdd-guardrails.yml; then
            echo 'formal=false' >> "$GITHUB_OUTPUT"
          else
            [[ $? == 1 ]] || exit 1
            echo 'formal=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js (20 LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install AST dependencies
        run: npm ci --prefix plugins/sdd-quality-loop/rules --ignore-scripts

      - name: Install locked MCP dependencies for cloud and bundle checks
        run: npm ci --prefix mcp/sdd-forge-mcp --ignore-scripts --no-audit --no-fund

      - name: Verify generated catch provenance for reviewed distribution changes
        env:
          BASE: ${{ steps.review.outputs.base }}
        run: |
          if git diff --quiet "$BASE" HEAD -- mcp/sdd-forge-mcp/dist/index.js mcp/sdd-forge-mcp/package-lock.json \
              plugins/sdd-quality-loop/rules/rebuilt-catches.mjs plugins/sdd-quality-loop/scripts/v2/run-agent-lint.mjs \
              tests/v2-agent-lint-bundle.test.mjs .github/workflows/sdd-guardrails.yml; then
            exit 0
          else
            [[ $? == 1 ]] || exit 1
          fi
          node --test tests/v2-agent-lint-bundle.test.mjs

      - name: Run v2 Lightweight Guardrails & ADR-0054 Self-Verification test suite
        run: node --test tests/v2-soft-guard.test.mjs tests/v2-spec-drift.test.mjs tests/v2-sdd-core-flow.test.mjs tests/v2-hooks-and-ci.test.mjs tests/v2-real-flows-e2e.test.mjs tests/v2-sdd-doctor.test.mjs tests/v2-software-factory.test.mjs tests/v2-agent-lint.test.mjs tests/v2-formal-gate.test.mjs tests/v2-wave3-integration.test.mjs tests/self-fitness.test.mjs tests/self-security-adversarial.test.mjs

      - name: Run sdd-doctor read-only harness health check
        run: node plugins/sdd-quality-loop/scripts/v2/sdd-doctor.mjs --root . --quiet-info

      - name: Evaluate added source lines and dependency manifests
        env:
          BASE: ${{ steps.review.outputs.base }}
        run: |
          node plugins/sdd-quality-loop/scripts/v2/run-agent-lint.mjs --diff-only --base-ref "$BASE" --mode shadow --format markdown >> "$GITHUB_STEP_SUMMARY"
          node plugins/sdd-quality-loop/scripts/v2/run-security-gate.mjs --adapters builtin-slopsquatting --mode shadow

      - name: Install pinned review scanners
        id: scanners
        if: "!cancelled() && steps.review.outcome == 'success'"
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 2 -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          python3 -m venv semgrep-venv
          semgrep-venv/bin/pip --disable-pip-version-check install --quiet 'semgrep==1.187.0'

      - name: Scan the reviewed range and retain only finding locations
        id: shadow
        if: "!cancelled() && steps.scanners.outcome == 'success'"
        env:
          BASE: ${{ steps.review.outputs.base }}
        run: |
          cd "$GITHUB_WORKSPACE"
          status=0
          "$RUNNER_TEMP/gitleaks" git --log-opts="$BASE..HEAD" --redact=100 --exit-code=42 \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json" . || status=$?
          [[ $status == 0 || $status == 42 ]] || exit "$status"
          gitleaks_seconds=$SECONDS
          SECONDS=0
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --baseline-commit "$BASE" \
            --config plugins/sdd-quality-loop/rules/security.yml --strict --metrics=off --disable-version-check \
            --quiet --json-output "$RUNNER_TEMP/semgrep.json" . > /dev/null
          jq -en --arg base "$BASE" --arg head "$GITHUB_SHA" --argjson status "$status" \
            --argjson gitleaks_seconds "$gitleaks_seconds" --argjson semgrep_seconds "$SECONDS" \
            --slurpfile leaks "$RUNNER_TEMP/gitleaks.json" --slurpfile sast "$RUNNER_TEMP/semgrep.json" \
            -f .github/scripts/project-shadow-findings.jq > "$RUNNER_TEMP/shadow-findings.tmp"
          mv "$RUNNER_TEMP/shadow-findings.tmp" "$RUNNER_TEMP/shadow-findings.json"
          jq -r '"Shadow findings: Gitleaks \(.gitleaks|length), Semgrep \(.semgrep|length)."' \
            "$RUNNER_TEMP/shadow-findings.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain shadow review evidence
        if: "!cancelled() && steps.shadow.outcome == 'success'"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-findings
          path: ${{ runner.temp }}/shadow-findings.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Java 21 for TLC
        if: steps.review.outputs.formal == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the pinned TLC download
        if: steps.review.outputs.formal == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/tlc/tla2tools.jar
          key: tlc-1.7.4-${{ hashFiles('specs/**/formal/**') }}
          restore-keys: tlc-1.7.4-

      - name: Run bounded TLC checks and the reservation bridge
        id: models
        if: steps.review.outputs.formal == 'true'
        shell: bash
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tlc/tla2tools.jar
        run: |
          mkdir -p "$RUNNER_TEMP/tlc"
          if [[ ! -f "$TLA2TOOLS_JAR" ]]; then
            curl --fail --silent --show-error --location --retry 2 -o "$TLA2TOOLS_JAR" \
              https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          fi
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS_JAR" | sha256sum -c -
          node --test --test-reporter=tap tests/v2-formal-gate.test.mjs | tee "$RUNNER_TEMP/formal-verification.tap"
          python3 tests/project-skill-formal.tests.py
          python3 tests/verify-review-reservation.py --jar "$TLA2TOOLS_JAR" --output "$RUNNER_TEMP/reservation"

      - name: Retain the model test and reservation bridge results
        if: "!cancelled() && steps.models.outcome != 'skipped'"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-verification
          path: |
            ${{ runner.temp }}/formal-verification.tap
            ${{ runner.temp }}/reservation/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Check Spec Drift across all baselined features
        run: |
          node - <<'EOF'
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';

          const specsRoot = path.resolve('specs');
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          let failed = false;
          let checked = 0;
          const unbaselined = [];

          if (fs.existsSync(specsRoot)) {
            for (const entry of fs.readdirSync(specsRoot, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const baseline = path.join(specsRoot, entry.name, '.spec-baseline.json');
              if (!fs.existsSync(baseline)) {
                // Approved but never baselined: outside drift coverage. List it
                // so a zero-comparison run is never mistaken for full coverage (#852).
                const tasksPath = path.join(specsRoot, entry.name, 'tasks.md');
                if (fs.existsSync(tasksPath) && /^[ \t]*Approval:[ \t]*Approved\b/m.test(fs.readFileSync(tasksPath, 'utf8'))) {
                  unbaselined.push(entry.name);
                }
                continue;
              }
              checked += 1;
              const res = spawnSync(
                process.execPath,
                [
                  'plugins/sdd-quality-loop/scripts/v2/check-spec-drift.mjs',
                  '--feature',
                  entry.name,
                  '--format',
                  'markdown',
                  '--fail-on-undeclared',
                ],
                { encoding: 'utf8' },
              );
              process.stdout.write(res.stdout || '');
              if (summaryPath && res.stdout) {
                fs.appendFileSync(summaryPath, `${res.stdout}\n`, 'utf8');
              }
              if (res.status !== 0) {
                failed = true;
              }
            }
          }

          const coverage =
            `Spec Drift coverage: ${checked} baselined feature(s) compared; ` +
            `${unbaselined.length} approved feature(s) without a baseline are NOT covered` +
            (unbaselined.length ? `: ${unbaselined.join(', ')}` : '') + '.\n';
          process.stdout.write(coverage);
          if (summaryPath) fs.appendFileSync(summaryPath, coverage, 'utf8');
          for (const name of unbaselined) {
            process.stdout.write(`::warning title=Spec Drift not covered::specs/${name} is approved but has no .spec-baseline.json; drift is not checked for it.\n`);
          }
          if (failed) {
            process.exit(1);
          }
          EOF

  nightly-codeql:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          upload: never
          output: ${{ runner.temp }}/codeql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-codeql-sarif
          path: ${{ runner.temp }}/codeql/*.sarif
          if-no-files-found: error
          retention-days: 14
      - name: Scan dependency manifests for slopsquatting
        if: "!cancelled()"
        run: node plugins/sdd-quality-loop/scripts/v2/run-security-gate.mjs --adapters builtin-slopsquatting --mode shadow
