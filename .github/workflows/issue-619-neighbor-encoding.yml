name: Issue 619 neighbor encoding comparison

on:
  push:
    branches: [fix/issue-619-neighbor-encoding]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

jobs:
  encoding:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        edition: [Core, Desktop]
        suite: [emit-run-record, evidence-bundle, panelist-verdict]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare exact baseline and current producers
        shell: python
        env:
          PROBE_EDITION: ${{ matrix.edition }}
          PROBE_SUITE: ${{ matrix.suite }}
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, sys, tempfile
          sys.stdout.reconfigure(encoding='utf-8', errors='backslashreplace')
          root = pathlib.Path.cwd()
          baseline = '4a55833441fe5d5e2ec76b6ed058efc3a7a7e13b'
          old = pathlib.Path(tempfile.mkdtemp(prefix='encoding-baseline-'))
          helper = 'tests/' + os.environ['PROBE_SUITE'] + '-encoding.tests.ps1'
          (old / 'tests').mkdir()
          shutil.copyfile(root / helper, old / helper)
          prefix = 'plugins/sdd-quality-loop/scripts/'
          for name in ('emit-run-record', 'generate-evidence-bundle', 'run-panelist-gpt', 'run-panelist-gemini'):
              relative = prefix + name + '.ps1'
              target = old / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(subprocess.check_output(['git', 'show', baseline + ':' + relative]))
          output = root / 'encoding-comparison'
          output.mkdir()
          producer = shutil.which('pwsh' if os.environ['PROBE_EDITION'] == 'Core' else 'powershell.exe')
          if not producer:
              raise SystemExit('Required native runtime missing')
          records = []
          for label, source in (('baseline', old), ('current', root)):
              argv = [producer, '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', str(source / helper),
                      '-Producer', producer, '-ExpectEdition', os.environ['PROBE_EDITION']]
              result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=240)
              (output / (label + '.log')).write_bytes(result.stdout)
              print(label, 'exit', result.returncode)
              print(result.stdout.decode('utf-8', errors='replace'))
              records.append({'source': label, 'argv': argv, 'exit_code': result.returncode,
                              'log_sha256': hashlib.sha256(result.stdout).hexdigest()})
          (output / 'comparison.json').write_text(json.dumps({
              'baseline': baseline, 'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'edition': os.environ['PROBE_EDITION'], 'suite': os.environ['PROBE_SUITE'], 'runs': records,
              'scope': 'Actual named-runtime producers and strict consumers. Baseline failures require log classification; no automatic BOM attribution.'
          }, indent=2) + '\n', encoding='utf-8')
          raise SystemExit(records[-1]['exit_code'])
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: encoding-${{ matrix.edition }}-${{ matrix.suite }}
          path: encoding-comparison/
          if-no-files-found: error
