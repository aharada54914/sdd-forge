  # Windows version gates use separate runners so the four deterministic
  # lanes do not contend for one runner's CPU.
  version-gates-windows-bump:
    name: version-gates-windows-bump (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: bash
            suite: tests/bump-version-gate.tests.sh
          - runtime: powershell
            suite: tests/bump-version-gate.tests.ps1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test bump-version loop-gate prerequisite
        shell: pwsh
        run: python tests/verification.py --suite "${{ matrix.suite }}" --run --receipt "${{ runner.temp }}/verification-restored-1.json"
      - name: Test release.yml required loop-gate job (bash)
        if: matrix.runtime == 'bash'
        shell: bash
        run: bash ./tests/release-loop-gate.tests.sh
      - name: Bind receipt artifact to actual job identity
        id: receipt-artifact
        if: always()
        shell: bash
        env:
          RECEIPT_JOB_NAME: version-gates-windows-bump (${{ matrix.runtime }})
        run: |-
          python - <<'PY_RECEIPT'
          import hashlib, json, os
          name = json.dumps({'name': os.environ['RECEIPT_JOB_NAME']}, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('job_key=' + hashlib.sha256(name).hexdigest() + '\n')
          PY_RECEIPT
      - name: Upload source-attempt execution receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt-artifact.outputs.job_key }}
          path: ${{ runner.temp }}/verification-restored-1.json
          if-no-files-found: error
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_version_gates_windows_bump == 'true'

  version-gates-windows-lanes:
    name: version-gates-windows-lanes (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [governance, capability, ownership, lite]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Windows version-gates lane
        shell: pwsh
        run: ./tests/run-version-gates-windows.ps1 -Lane ${{ matrix.lane }}
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_version_gates_windows_lanes == 'true'


  # mcp-tests — sdd-forge-mcp (mcp/sdd-forge-mcp/) is the repo's first
  # Node/TypeScript component: a read-only MCP server exposing SDD workflow
  # state. Its tasks.md state-machine parser must stay shell-equivalent with
  # check-task-state.sh (golden tests), so it is exercised across the same
  # 3-OS matrix as the rest of the suite. On POSIX runners the golden tests
  # execute the real shell scripts; on Windows they compare against recorded
  # fixtures (process.platform branch inside the test suite itself).
  mcp-tests:
    name: mcp-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp/sdd-forge-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the golden task-state tests exercise
          # check-evidence-bundle, which resolves each bundle's recorded
          # git_commit binding via git; a shallow clone cannot see them.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: mcp/sdd-forge-mcp/package-lock.json

      - name: Bind npm cache to actual Node runtime
        id: node-runtime
        shell: bash
        run: |
          printf 'version=%s\n' "$(node --version)" >> "$GITHUB_OUTPUT"
          printf 'npm_config_cache=%s\n' "$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
      - name: Reuse integrity-checked npm download bytes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/npm-cache/_cacache
          key: >-
            npm-${{ runner.os }}-node22-${{ steps.node-runtime.outputs.version }}-${{ github.event_name }}-${{
            github.event.pull_request.number || 'trusted' }}-${{ hashFiles('mcp/sdd-forge-mcp/package-lock.json') }}
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # dist-parity (AC-010): rebuild the esbuild bundle and confirm the
      # working tree's committed dist/index.js is reproducible from source.
      # Runs once on Linux to keep the check OS-agnostic and fast; esbuild
      # output is deterministic across platforms for this bundle.
      - name: Rebuild dist and verify parity
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run build
          git diff --exit-code -- dist/

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_mcp_tests == 'true'


  # B2 — exercise the SDD hook guard with the REAL CLI toolchains installed on
  # each OS, through the exact command line each CLI's hook config invokes. This
  # closes the gap that the unit/scenario suites only run the guard scripts in
  # isolation; here Claude Code / Codex / Copilot binaries are actually present.
  # (A live agent session that fires the hook needs an API-key secret and is
  # non-deterministic, so it is not gated here — the deterministic enforcement
  # below is what protects the branch.)
  # local-env-mcp-tests — local-env-mcp (mcp/local-env-mcp/) is a read-only
  # MCP server exposing local environment info (OS, toolchain versions, CLI
  # availability) with no execution capability (ADR-0003/ADR-0004 pattern,
