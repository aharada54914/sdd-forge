name: Test installers and gates

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# Cancel superseded runs of the same pull request. Pushes to main and
# merge-queue runs fall back to the unique run_id group, so they are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  a9-advisory-inputs:
    name: A9 advisory activation detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      active: ${{ steps.detect.outputs.active }}
    steps:
      - name: Read trusted base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Read exact PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          persist-credentials: false
      - name: Detect advisory activation without executing repository code
        id: detect
        shell: bash
        env:
          A9_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          active = os.environ['A9_EVENT_NAME'] == 'pull_request' and any(
              os.path.lexists(root + '/sdd/project-context.yaml') for root in ('trusted', 'subject'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('active=' + str(active).lower() + '\n')
          print(json.dumps({'state': 'inputs_required' if active else 'not_activated',
                            'advisory_observed': False}))
          PYCODE

  a9-advisory:
    name: capability-mode Gate
    needs: [a9-advisory-inputs]
    if: needs.a9-advisory-inputs.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted collection implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout isolated exact PR head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Collect actual advisory consumers with explicit request
        shell: bash
        env:
          A9_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          A9_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          if [ ! -f trusted/scripts/observe-a9-advisory.py ]; then
            echo '{"state":"blocked","result":"BLOCKED","authorization_checked":false,"missing_inputs":["trusted_collector"]}'
            exit 1
          fi
          if ! git -C subject fetch --no-tags ../trusted "$A9_BASE_SHA" >/dev/null 2>&1; then
            echo '{"state":"blocked","result":"BLOCKED","authorization_checked":false,"missing_inputs":["base_revision"]}'
            exit 1
          fi
          private_dir=$(mktemp -d "$RUNNER_TEMP/a9-observation.XXXXXX")
          python3 trusted/scripts/observe-a9-advisory.py \
            --repo-root "$GITHUB_WORKSPACE/subject" \
            --base-sha "$A9_BASE_SHA" --head-sha "$A9_HEAD_SHA" \
            --request sdd/a9-advisory-request.json \
            --output "$private_dir/observation.json"
          # Raw evidence stays private and is deliberately never uploaded.
          # A safe summary/check success alone cannot complete release evidence.

  # The shared catalog declares local and CI coverage. Missing registrations
  # fail validation; CI never infers execution from workflow text.
  posix-regression:
    name: complete POSIX regression inventory
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install structural YAML parser
        run: npm ci --prefix mcp/sdd-forge-mcp --ignore-scripts
      - name: Test required-checks POSIX failure propagation
        run: python3 tests/required-checks-posix.tests.py

      - name: Test Codex MCP config preservation and escaping
        run: python3 tests/codex-mcp-config.tests.py
      - name: Test verification catalog and shadow selection
        shell: bash
        run: |
          python3 tests/verification-catalog.tests.py
          python3 tests/verification-impact.tests.py
      - name: Observe impact selection without skipping required checks
        shell: bash
        env:
          VERIFICATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFICATION_HEAD: ${{ github.sha }}
        run: |
          python3 tests/verification-impact.py --base "$VERIFICATION_BASE" --head "$VERIFICATION_HEAD" > "$RUNNER_TEMP/verification-impact.json"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'verification-impact.json').read_text())
          summary = {key: result[key] for key in ('mode', 'required_checks', 'reason', 'full_count')}
          summary['selected_count'] = len(result['selected'])
          summary['comparison'] = result['comparison']['status']
          print(json.dumps(summary))
          PYCODE
      - name: Install pinned RTK
        shell: bash
        run: |
          set -euo pipefail
          rtk_dir=$(mktemp -d "$RUNNER_TEMP/rtk.XXXXXX")
          curl --fail --silent --show-error --location https://github.com/rtk-ai/rtk/releases/download/v0.51.0/rtk-x86_64-unknown-linux-musl.tar.gz --output "$rtk_dir/rtk.tar.gz"
          printf '%s  %s\n' 5028d3b19a8f0990d30fec9fbb07e32782bc5698e618fb1861aad8a9ccba4eb5 "$rtk_dir/rtk.tar.gz" | sha256sum --check --strict
          tar -xzf "$rtk_dir/rtk.tar.gz" -C "$rtk_dir" rtk
          "$rtk_dir/rtk" --version
          printf '%s\n' "$rtk_dir" >> "$GITHUB_PATH"
      - name: Test evaluator scratch isolation (Bash and PowerShell)
        shell: bash
        run: python3 tests/issue311-scratch-isolation.tests.py --repo "$GITHUB_WORKSPACE"
      - name: Test evaluator implementation binding (Bash and PowerShell)
        shell: bash
        run: python3 tests/review-implementation-binding.tests.py --repo .
      - name: Test shared quality non-TTY transport contracts
        shell: bash
        run: python3 -B tests/quality-nontty-transport.tests.py
      - name: Check shared launch Python and FilesOnly distribution
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/shared-launch-python"
          "$RUNNER_TEMP/shared-launch-python/bin/pip" install -r tests/shared-launch-python-requirements.txt
          "$RUNNER_TEMP/shared-launch-python/bin/python" - <<'PY'
          import pathlib, subprocess, sys, tomllib
          config = pathlib.Path('tests/shared-launch-python/pyproject.toml')
          files = tomllib.loads(config.read_text())['tool']['mypy']['files']
          subprocess.run([sys.executable, '-m', 'ruff', 'check', '--config', str(config), *files], check=True)
          subprocess.run([sys.executable, '-m', 'mypy', '--config-file', str(config)], check=True)
          PY
      - name: Test shared launch FilesOnly distribution
        shell: bash
        run: python3 -B tests/shared-launch-build.tests.py
      - name: Test traceability freeze normalization
        shell: bash
        run: python3 -B tests/traceability-freeze-contract.tests.py
      - name: Test POSIX kill-switch permission failures
        shell: bash
        run: python3 tests/verification.py --suite tests/kill-switch-inspection.tests.sh --run --receipt "${{ runner.temp }}/verification-restored-1.json"
      - name: Install contract validator
        run: npm ci --prefix mcp/ci-mcp --ignore-scripts
      - name: Prepare private research-store fixture parent
        shell: bash
        run: |
          set -euo pipefail
          fixture_parent=$(sudo mktemp -d /var/lib/sdd-research-ci.XXXXXXXX)
          sudo chown "$(id -u):$(id -g)" "$fixture_parent"
          printf 'SDD_TEST_SHARED_STORE_PARENT=%s\n' "$fixture_parent" >> "$GITHUB_ENV"
      - name: Test shared review launch and conditional input contracts
        shell: bash
        run: |
          python3 tests/verification.py --profile ci-shared-python --run --receipt "$RUNNER_TEMP/verification-shared-python.json"
      - name: Remove private research-store fixture parent
        if: always()
        shell: bash
        run: |
          case "${SDD_TEST_SHARED_STORE_PARENT:-}" in
            /var/lib/sdd-research-ci.*) sudo rmdir "$SDD_TEST_SHARED_STORE_PARENT" ;;
          esac
      - name: Bind Pester cache to actual PowerShell runtime
        id: pester-runtime
        shell: pwsh
        run: '"version=$($PSVersionTable.PSVersion.ToString())" >> $env:GITHUB_OUTPUT'
      - name: Reuse pinned Pester package bytes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/pester-package-cache/*.nupkg
          key: >-
            pester-${{ runner.os }}-pwsh-${{ steps.pester-runtime.outputs.version
            }}-4.10.1-898210e1a30c52cd46ba317c2278a9324345214213aa2f7d6b7dfa7b98f37ac9-${{ github.event_name }}-${{
            github.event.pull_request.number || 'trusted' }}
      - name: Install pinned domain regression test runner
        shell: pwsh
        run: >-
          python3 -B tests/ci-dependency-cache.py pester --cache-dir "$env:RUNNER_TEMP/pester-package-cache" --module-root
          "$env:HOME/.local/share/powershell/Modules"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test domain concept modeling and review contracts
        shell: pwsh
        run: ./tests/sdd-domain.tests.ps1
      - name: Test guard dispatch fallback
        shell: bash
        run: bash ./tests/guard-dispatch-fallback.tests.sh
      - name: Test guard negative corpus
        shell: bash
        run: bash ./tests/guard-negative-corpus.tests.sh
      - name: Test deterministic lane coverage
        shell: bash
        run: bash ./tests/deterministic-lane-selfcheck.tests.sh
      - name: Test workflow scenarios
        shell: bash
        run: bash ./tests/workflow-scenarios/workflow-scenarios.tests.sh
      - name: Test design system contract (Bash)
        shell: bash
        run: bash ./tests/design-system-contract.tests.sh
      - name: Test design system contract (PowerShell)
        shell: pwsh
        run: ./tests/design-system-contract.tests.ps1
      - name: Test design sync standing consent (Bash)
        shell: bash
        run: bash ./tests/design-sync-standing-consent.tests.sh
      - name: Test design sync standing consent (PowerShell)
        shell: pwsh
        run: ./tests/design-sync-standing-consent.tests.ps1
      - name: Bind receipt artifact to actual job identity
        id: receipt-artifact
        if: always()
        shell: bash
        env:
          RECEIPT_JOB_NAME: complete POSIX regression inventory
        run: |-
          python - <<'PY_RECEIPT'
          import hashlib, json, os
          name = json.dumps({'name': os.environ['RECEIPT_JOB_NAME']}, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('job_key=' + hashlib.sha256(name).hexdigest() + '\n')
          PY_RECEIPT
      - name: Upload source-attempt execution receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt-artifact.outputs.job_key }}
          path: |
            ${{ runner.temp }}/verification-restored-1.json
            ${{ runner.temp }}/verification-shared-python.json
          if-no-files-found: error
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_posix_regression == 'true'


  # Measured suite costs balance the catalog partitions; every partition
  # remains mandatory and together they execute the complete fallback set.
  posix-unwired-sharded:
    name: POSIX unwired shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install structural YAML parser
        run: npm ci --prefix mcp/sdd-forge-mcp --ignore-scripts

      - name: Install contract validator
        run: npm ci --prefix mcp/ci-mcp --ignore-scripts
      - name: Run POSIX inventory shard
        shell: bash
        run: bash ./tests/run-ci-unwired.sh --shard-index "${{ matrix.shard }}" --shard-count 4 --receipt "$RUNNER_TEMP/verification-shard.json"
      - name: Bind receipt artifact to actual job identity
        id: receipt-artifact
        if: always()
        shell: bash
        env:
          RECEIPT_JOB_NAME: POSIX unwired shard (${{ matrix.shard }})
        run: |-
          python - <<'PY_RECEIPT'
          import hashlib, json, os
          name = json.dumps({'name': os.environ['RECEIPT_JOB_NAME']}, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('job_key=' + hashlib.sha256(name).hexdigest() + '\n')
          PY_RECEIPT
      - name: Upload source-attempt execution receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt-artifact.outputs.job_key }}
          path: ${{ runner.temp }}/verification-shard.json
          if-no-files-found: error
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_posix_unwired_sharded == 'true'

  test:
    # Branch protection keeps stable OS context names; os is the actual runner.
    name: test (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            check: windows-latest
          - os: macos-26-intel
            check: macos-latest
          - os: ubuntu-latest
            check: ubuntu-latest
    runs-on: ${{ matrix.os }}
    # Bound PowerShell-heavy Intel work without shortening other platforms' coverage.
    timeout-minutes: ${{ matrix.os == 'macos-26-intel' && 90 || 30 }}
    steps:
      # eval-lane: (none yet)
      - name: "[deterministic] Setup step 1"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: review-loop prechecks and provenance tests resolve
          # recorded commit hashes (e.g. TDD Red commits) via git rev-parse.
          fetch-depth: 0
      - name: "[deterministic] Install structural YAML parser"
        if: needs.ci-plan.outputs.run_test == 'true'
        run: npm ci --prefix mcp/sdd-forge-mcp --ignore-scripts

      - name: "[deterministic] Test measurement clocks on native platforms"
        if: needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: python -B tests/run-measurement.tests.py

      - name: "[deterministic] Test selected-plan and Lite full promotion on native platforms"
        if: needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: python -B tests/sdd-domain-multitarget-T-003.tests.py

      - name: "[deterministic] Test Concept Test gate on native Windows"
        if: runner.os == 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: python -B tests/concept-test.tests.py

      - name: "[deterministic] Test domain review finalization on native platforms"
        if: needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: python -B tests/domain-review-finalize.tests.py

      - name: "[deterministic] Verify generated guard invariants (Windows)"
        if: runner.os == 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: python ./plugins/sdd-quality-loop/scripts/generate-guard-invariants.py --check

      - name: "[deterministic] Verify generated guard invariants (POSIX)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: bash
        run: python3 ./plugins/sdd-quality-loop/scripts/generate-guard-invariants.py --check

      # epic-190-a2-capability-registry T-006 (REQ-005 AC-026): drift lock for
      # the generated gate-capabilities.json projection, mirroring the guard
      # invariants --check steps immediately above (design.md Deployment / CI
      # Plan; infra-spec.md CI/CD Sequence).
      - name: "[deterministic] Verify generated gate-capabilities projection (Windows)"
        if: runner.os == 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: python ./plugins/sdd-quality-loop/scripts/generate-gate-capabilities.py --check

      - name: "[deterministic] Verify generated gate-capabilities projection (POSIX)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: bash
        run: python3 ./plugins/sdd-quality-loop/scripts/generate-gate-capabilities.py --check

      # epic-190-a2-capability-registry T-006 (REQ-005 AC-027, Done-When 3):
      # drift lock for the VENDORED contracts copy under
      # plugins/sdd-quality-loop/contracts/. This is the SECOND of the two
      # --check steps tasks.md's Scope assigns to this task in one sentence
      # (the projection generator's own --check step -- the step pair
      # immediately above -- "and the vendoring step's `--check` step");
      # RT-20260809-002 item 1 recorded its absence. Deliberately paraphrased
      # rather than quoted verbatim: spelling out the projection step's exact
      # `<script>.py --check` command string here would keep the suite's grep
      # for that command satisfied even after the step itself were deleted,
      # silently disarming the assertion. Do not re-introduce the literal.
      # Release gate per design.md Deployment / CI Plan ("the
      # vendoring/packaging step's own --check mode (P10, Registry discovery
      # contract -- sha256 comparison of each canonical contracts/* file
      # against its vendored plugins/sdd-quality-loop/contracts/* counterpart,
      # as a release gate)") and infra-spec.md CI/CD Sequence.
      #
      # Deliberately a SEPARATE step from the projection drift lock above,
      # not an extra command inside it: the two scripts compare disjoint
      # artifact pairs (generated/gate-capabilities.json vs the canonical
      # Registry; plugins/sdd-quality-loop/contracts/* vs contracts/*), so
      # removing either step leaves the other's failure mode entirely
      # undetected. tests/generate-gate-capabilities.tests.{sh,ps1} assert
      # each of the two independently for exactly that reason.
      - name: "[deterministic] Verify vendored contracts copy (Windows)"
        if: runner.os == 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: python ./plugins/sdd-quality-loop/scripts/vendor-capability-registry.py --check

      - name: "[deterministic] Verify vendored contracts copy (POSIX)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: bash
        run: python3 ./plugins/sdd-quality-loop/scripts/vendor-capability-registry.py --check

      # pwsh steps run the test scripts directly: piping through tee changes
      # pwsh exit-code semantics ($LASTEXITCODE leakage), and the job console
      # log already captures their output.
      - name: "[deterministic] Validate workflow state (PowerShell)"
        if: needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./plugins/sdd-quality-loop/scripts/check-workflow-state.ps1

      - name: "[deterministic] Validate workflow state (POSIX)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: bash
        run: bash ./plugins/sdd-quality-loop/scripts/check-workflow-state.sh

      - name: "[deterministic] Validate repository"
        if: needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./tests/validate-repository.ps1

      - name: "[deterministic] Validate repository (POSIX)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: bash
        run: ./tests/validate-repository.sh

      - name: "[deterministic] Test repository release validation parity"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: bash
        run: ./tests/repository-release-validation.tests.sh

      - name: "[deterministic] Test deterministic gate scripts"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./tests/scripts.tests.ps1

      - name: "[deterministic] Test run-record feature scope and CRLF identity"
        if: needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./tests/emit-run-record-feature-scope.tests.ps1

      - name: "[deterministic] Test selected-feature structure validation"
        if: needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./tests/structure-check-feature-mode.tests.ps1

      - name: "[deterministic] Test quality-gate cycle-limit suite (bash)"
        if: needs.ci-plan.outputs.run_test == 'true'
        shell: bash
        run: bash ./tests/quality-gate-cycle-limit.tests.sh

      - name: "[deterministic] Test portable review-loop prechecks (pwsh)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: |
          python tests/verification.py --profile ci-portable-prechecks --run --receipt "${{ runner.temp }}/verification-restored-1.json"

      - name: "[deterministic] Test task prior-pass receipt (pwsh)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./tests/task-prior-pass-receipt.tests.ps1

      - name: "[deterministic] Test cross-model gate (pwsh)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./tests/cross-model.tests.ps1

      - name: "[deterministic] Test Phase 2 guard invariants (pwsh)"
        if: runner.os == 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./tests/phase2-guard-invariants.tests.ps1

      - name: "[deterministic] Test Phase 2 guard invariants (bash)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: bash
        run: bash ./tests/phase2-guard-invariants.tests.sh

      - name: "[deterministic] Test hook guards"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./tests/hooks.tests.ps1

      - name: "[deterministic] Test cross-runtime scenario suite (pwsh)"
        if: needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./tests/scenario.tests.ps1
      - name: "[deterministic] Test review hash normalization (pwsh)"
        if: needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: ./tests/review-hash-normalization.tests.ps1

      # Epic A7's PowerShell compatibility suites are already part of the
      # runner inventory, but must also execute on the native Windows leg.
      # Keep the two expensive capture suites in separate required Windows
      # jobs so their independent assertions run in parallel.
      - name: "[deterministic] Test Epic A7 compatibility suites (pwsh)"
        if: runner.os == 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: pwsh
        run: |
          python tests/verification.py --profile ci-a7-native --run --receipt "${{ runner.temp }}/verification-restored-2.json"

      - name: "[deterministic] Test guards (bash)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: bash
        run: |
          ./tests/guards.tests.sh 2>&1 | tee "${{ runner.temp }}/guards-tests.log"

      - name: "[deterministic] Test approval boundary (bash)"
        if: runner.os != 'Windows' && needs.ci-plan.outputs.run_test == 'true'
        shell: bash
        run: |
          bash tests/approval-boundary.tests.sh 2>&1 | tee "${{ runner.temp }}/approval-boundary-tests.log"

      - name: "[deterministic] Test deterministic gates (bash)"
