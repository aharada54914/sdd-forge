    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: bash
            suite: tests/bump-version-gate.tests.sh
          - runtime: powershell
            suite: tests/bump-version-gate.tests.ps1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test bump-version loop-gate prerequisite
        shell: pwsh
        run: python tests/verification.py --suite "${{ matrix.suite }}" --run --receipt "${{ runner.temp }}/verification-1.json"
      - name: Test release.yml required loop-gate job (bash)
        if: matrix.runtime == 'bash'
        shell: bash
        run: bash ./tests/release-loop-gate.tests.sh
      - name: Bind receipt artifact to actual job identity
        id: receipt-artifact
        if: always()
        shell: bash
        env:
          RECEIPT_JOB_NAME: version-gates-windows-bump (${{ matrix.runtime }})
        run: |-
          python - <<'PY_RECEIPT'
          import hashlib, json, os
          name = json.dumps({'name': os.environ['RECEIPT_JOB_NAME']}, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('job_key=' + hashlib.sha256(name).hexdigest() + '\n')
          PY_RECEIPT
      - name: Upload source-attempt execution receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt-artifact.outputs.job_key }}
          path: ${{ runner.temp }}/verification-*.json
          if-no-files-found: error
    needs:
      - ci-plan
    if: needs.ci-plan.outputs.run_version_gates_windows_bump == 'true'
  version-gates-windows-lanes:
    name: version-gates-windows-lanes (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane:
          - governance
          - capability
          - ownership
          - lite
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test Windows version-gates lane
        shell: pwsh
        run: ./tests/run-version-gates-windows.ps1 -Lane ${{ matrix.lane }}
