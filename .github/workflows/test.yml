        os: [windows-latest, macos-26-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Claude Code CLI
        shell: bash
        run: |
          npm install -g --allow-scripts=@anthropic-ai/claude-code "@anthropic-ai/claude-code@${{ env.CLAUDE_CLI_VERSION }}"
          claude --version

      - name: Install Codex CLI (best-effort)
        shell: bash
        continue-on-error: true
        run: npm install -g "@openai/codex@${{ env.CODEX_CLI_VERSION }}"

      - name: Install Copilot CLI (best-effort)
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-copilot

      - name: CLI hook enforcement (real toolchain present)
        shell: pwsh
        run: ./tests/cli-hook-enforcement.ps1
      - name: Claude host blocks missing hook executables (local API fixture)
        shell: bash
        run: python3 tests/claude-hook-runtime.tests.py --output claude-hook-runtime-proof.json
      - name: Preserve Claude host runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-hook-runtime-${{ matrix.os }}-${{ github.run_attempt }}
          path: claude-hook-runtime-proof.json
          if-no-files-found: error
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_cli_hook_enforcement == 'true'


  # Recovery uses an independent native matrix so its process-heavy negative
  # corpus does not consume the existing regression jobs' time budgets.
  interrupted-recovery:
    name: interrupted recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install structural YAML parser
        run: npm ci --prefix mcp/sdd-forge-mcp --ignore-scripts
      - name: "[deterministic] Test interrupted review recovery (PowerShell)"
        shell: pwsh
        run: ./tests/spec-review-interrupted-recovery.tests.ps1

      - name: "[deterministic] Test interrupted review recovery (POSIX)"
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./tests/spec-review-interrupted-recovery.tests.sh
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_interrupted_recovery == 'true'

  windows-powershell:
    name: Windows PowerShell ${{ matrix.version }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "5.1"
            executable: powershell
            profile: ci-windows-powershell51
          - version: "7.6"
            executable: pwsh
            profile: ci-windows-powershell7
    env:
      SDD_EXPECTED_POWERSHELL: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native Windows compatibility contracts
        shell: cmd
        env:
          SDD_POWERSHELL_RECEIPT: ${{ runner.temp }}/powershell-runtime.json
        run: python tests/verification.py --profile ${{ matrix.profile }} --powershell ${{ matrix.executable }} --run --receipt "${{ runner.temp }}/powershell-verification.json"
      - name: Retain runtime identity and verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-powershell-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/powershell-runtime.json
            ${{ runner.temp }}/powershell-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Bind receipt artifact to actual job identity
        id: receipt-artifact
        if: always()
        shell: bash
        env:
          RECEIPT_JOB_NAME: Windows PowerShell ${{ matrix.version }}
        run: |-
          python - <<'PY_RECEIPT'
          import hashlib, json, os
          name = json.dumps({'name': os.environ['RECEIPT_JOB_NAME']}, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('job_key=' + hashlib.sha256(name).hexdigest() + '\n')
          PY_RECEIPT
      - name: Upload source-attempt execution receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt-artifact.outputs.job_key }}
          path: ${{ runner.temp }}/powershell-verification.json
          if-no-files-found: error
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_windows_powershell == 'true'

  cloud-native:
    name: Cloud contracts and local tools (${{ matrix.os }})
    timeout-minutes: ${{ matrix.os == 'macos-26-intel' && 90 || 30 }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-26-intel
          - ubuntu-latest
    steps:
      - name: Checkout cloud assertions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: '[deterministic] Install pinned local cloud compilation tools (Linux only)'
        if: runner.os == 'Linux'
        shell: bash
        run: >
          set -euo pipefail

          tools=$(mktemp -d "$RUNNER_TEMP/cloud-native.XXXXXX")

          tools=$(cd "$tools" && pwd -P)

          curl --retry 2 --retry-all-errors --retry-delay 1 --fail --silent --show-error --location --connect-timeout 30 --max-time 180
          https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64 --output "$tools/bicep"

          printf '%s  %s\n' b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e "$tools/bicep" | sha256sum --check --strict

          chmod +x "$tools/bicep"

          curl --retry 2 --retry-all-errors --retry-delay 1 --fail --silent --show-error --location --connect-timeout 30 --max-time 180
          https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz --output "$tools/node.tar.xz"

          printf '%s  %s\n' 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647 "$tools/node.tar.xz" | sha256sum --check
          --strict

          tar -xJf "$tools/node.tar.xz" -C "$tools"

          export PATH="$tools/node-v24.19.0-linux-x64/bin:$PATH"

          test "$(node --version)" = v24.19.0

          test "$(npm --version)" = 11.17.0

          mkdir "$tools/cdk"

          cp plugins/sdd-aws-cloud/examples/private-ec2/package.json plugins/sdd-aws-cloud/examples/private-ec2/package-lock.json
          "$tools/cdk/"

          npm ci --prefix "$tools/cdk" --ignore-scripts --no-audit --no-fund

          echo "CLOUD_BICEP_BIN=$tools/bicep" >> "$GITHUB_ENV"

          echo "CLOUD_NODE_BIN=$tools/node-v24.19.0-linux-x64/bin/node" >> "$GITHUB_ENV"

          echo "CLOUD_CDK_ROOT=$tools/cdk" >> "$GITHUB_ENV"

          echo "CLOUD_REQUIRE_NATIVE=1" >> "$GITHUB_ENV"
        env:
          npm_config_fetch_retries: '2'
          npm_config_loglevel: http
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Bind npm cache to actual Node runtime
        id: node-runtime
        shell: bash
        run: |
          printf 'version=%s\n' "$(node --version)" >> "$GITHUB_OUTPUT"
          printf 'npm_config_cache=%s\n' "$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
      - name: Reuse integrity-checked npm download bytes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/npm-cache/_cacache
          key: >-
            npm-${{ runner.os }}-node22-${{ steps.node-runtime.outputs.version }}-${{ github.event_name }}-${{
            github.event.pull_request.number || 'trusted' }}-${{ hashFiles('mcp/sdd-forge-mcp/package-lock.json') }}
      - name: Install pinned workflow parser dependencies
        shell: bash
        run: npm ci --prefix mcp/sdd-forge-mcp --ignore-scripts
        env:
          npm_config_fetch_retries: '2'
          npm_config_loglevel: http
      - name: '[deterministic] Test cloud suites, installed packages and current multitarget boundaries'
        env:
          CLOUD_REQUIRE_NATIVE: ${{ runner.os == 'Linux' && '1' || '0' }}
        shell: pwsh
        run: python -B tests/verification.py --profile ci-cloud --run --receipt "${{ runner.temp }}/verification-cloud.json"
      - name: Retain cloud verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-verification-${{ matrix.os }}
          path: ${{ runner.temp }}/verification-cloud.json
          if-no-files-found: error
          retention-days: 14
      - name: Bind receipt artifact to actual job identity
        id: receipt-artifact
        if: always()
        shell: bash
        env:
          RECEIPT_JOB_NAME: Cloud contracts and local tools (${{ matrix.os }})
        run: |-
          python - <<'PY_RECEIPT'
          import hashlib, json, os
          name = json.dumps({'name': os.environ['RECEIPT_JOB_NAME']}, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('job_key=' + hashlib.sha256(name).hexdigest() + '\n')
          PY_RECEIPT
      - name: Upload source-attempt execution receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt-artifact.outputs.job_key }}
          path: ${{ runner.temp }}/verification-cloud.json
          if-no-files-found: error
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_cloud_native == 'true'

  required-checks:
    name: required-checks
    runs-on: ubuntu-latest
    if: always()
    needs: [a9-advisory-inputs, a9-advisory, posix-regression, posix-unwired-sharded, test, installers, loops-routing, version-gates, version-gates-windows-bump, version-gates-windows-lanes, mcp-tests, local-env-mcp-tests, ci-mcp-tests, cli-hook-enforcement, interrupted-recovery, windows-powershell, cloud-native, test-windows-heavy, coding-standards, ci-plan]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install structural YAML parser
        shell: bash
        run: npm ci --prefix mcp/sdd-forge-mcp --ignore-scripts
      - name: Download original same-run CI plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ARTIFACT_NAME: ${{ needs.ci-plan.outputs.plan_artifact_name }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PLAN_ARTIFACT_NAME" --dir "$RUNNER_TEMP/verification-plan"
      - name: Collect actual same-run execution observations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT: ${{ github.event_name }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_TESTED_SHA: ${{ github.sha }}
        run: >-
          python3 -B tests/verification-ci.py collect --github-event-context --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --output-dir
          "$RUNNER_TEMP/verification-observations"
      - name: Check all required tests passed
        shell: bash
        env:
          API_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 -B tests/verification-ci.py aggregate --root . --plan "$RUNNER_TEMP/verification-plan/plan.json" --observations
          "$RUNNER_TEMP/verification-observations" --run-id "$GITHUB_RUN_ID" --api-head-sha "$API_HEAD_SHA" --output
          "$RUNNER_TEMP/verification-result.json"

  test-windows-heavy:
    name: test-windows-heavy (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [compatibility, gates, a9]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: "[deterministic] Setup step 1"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A7 executes current working-tree payload in independent F1/F2 fixtures.
      # It remains a required native-Windows assertion, but runs in parallel
      # with the golden-baseline suite in the main Windows test job.
      - name: "[deterministic] Test A7 byte-identical compatibility (pwsh)"
        if: matrix.lane == 'compatibility'
        shell: pwsh
        run: ./tests/compatibility-byte-identical.tests.ps1

      - name: "[deterministic] Test A7 current-product reachability"
        if: matrix.lane == 'compatibility'
        shell: pwsh
        run: python -B tests/current-byte-capture.tests.py

      - name: "[deterministic] Test deterministic gate scripts"
        if: matrix.lane == 'gates'
        shell: pwsh
        run: ./tests/scripts.tests.ps1
      - name: "[deterministic] Test portable review-loop prechecks"
        if: matrix.lane == 'gates'
        shell: pwsh
        run: |
          python tests/verification.py --profile ci-portable-prechecks --run --receipt "${{ runner.temp }}/verification-restored-1.json"
      - name: "[deterministic] Test task prior-pass receipt"
        if: matrix.lane == 'gates'
        shell: pwsh
        run: ./tests/task-prior-pass-receipt.tests.ps1
      - name: "[deterministic] Test A9 unpublished candidate and Pack"
        if: matrix.lane == 'a9'
        shell: pwsh
        run: ./tests/a9-dogfood.tests.ps1
      - name: "[deterministic] Test cross-model gate"
        if: matrix.lane == 'gates'
        shell: pwsh
        run: ./tests/cross-model.tests.ps1
      - name: "[deterministic] Test hook guards"
        if: matrix.lane == 'gates'
        shell: pwsh
        run: ./tests/hooks.tests.ps1
      - name: "[deterministic] Test panelist-input consent gate"
        if: matrix.lane == 'gates'
        shell: pwsh
        run: ./tests/prepare-panelist.tests.ps1

      # epic-196-a8-integration T-001 (REQ-001, AC-001..006): offline
      # cross-runtime handoff contract and activation-gate fixture. The live
      # CLI path is opt-in inside the suite and is never used by CI.
      - name: "[deterministic] Test cross-runtime handoff fixture (pwsh)"
        if: matrix.lane == 'gates'
        shell: pwsh
        run: ./tests/cross-runtime-handoff.tests.ps1

      # epic-196-a8-integration T-002 (REQ-005, AC-022..AC-023): read-only
      # installed-plugin drift comparison in both wrapper runtimes.
      - name: "[deterministic] Test installed-plugin drift check (pwsh)"
        if: matrix.lane == 'gates'
        shell: pwsh
        run: ./tests/check-installed-plugin-drift.tests.ps1
      - name: Bind receipt artifact to actual job identity
        id: receipt-artifact
        if: always()
        shell: bash
        env:
          RECEIPT_JOB_NAME: test-windows-heavy (${{ matrix.lane }})
        run: |-
          python - <<'PY_RECEIPT'
          import hashlib, json, os
          name = json.dumps({'name': os.environ['RECEIPT_JOB_NAME']}, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('job_key=' + hashlib.sha256(name).hexdigest() + '\n')
          PY_RECEIPT
      - name: Upload source-attempt execution receipts
        if: always() && matrix.lane == 'gates'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt-artifact.outputs.job_key }}
          path: ${{ runner.temp }}/verification-restored-1.json
          if-no-files-found: error
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_test_windows_heavy == 'true'

  coding-standards:
    name: native coding standards checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Install locked TypeScript compiler
        run: npm ci --prefix mcp/sdd-forge-mcp --ignore-scripts
      - name: Install pinned native analyzers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/coding-standards"
          "$RUNNER_TEMP/coding-standards/bin/pip" install -r tests/coding-standards/requirements.txt
          printf '%s\n' "$RUNNER_TEMP/coding-standards/bin" >> "$GITHUB_PATH"
      - name: Install pinned PowerShell analyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -ErrorAction Stop
      - name: Run native controls and complete tracked-source audit
        shell: bash
        run: python3 tests/verification.py --profile coding-standards --run --receipt "$RUNNER_TEMP/coding-standards-receipt.json"
      - name: Bind receipt artifact to actual job identity
        id: receipt-artifact
        if: always()
        shell: bash
        env:
          RECEIPT_JOB_NAME: native coding standards checks
        run: |-
          python - <<'PY_RECEIPT'
          import hashlib, json, os
          name = json.dumps({'name': os.environ['RECEIPT_JOB_NAME']}, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('job_key=' + hashlib.sha256(name).hexdigest() + '\n')
          PY_RECEIPT
      - name: Upload source-attempt execution receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt-artifact.outputs.job_key }}
          path: ${{ runner.temp }}/coding-standards-receipt.json
          if-no-files-found: error
    needs: [ci-plan]
    if: needs.ci-plan.outputs.run_coding_standards == 'true'

  ci-plan:
    name: ci-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_a9_advisory: ${{ steps.plan.outputs.run_a9_advisory }}
      run_a9_advisory_inputs: ${{ steps.plan.outputs.run_a9_advisory_inputs }}
      run_ci_mcp_tests: ${{ steps.plan.outputs.run_ci_mcp_tests }}
      run_ci_plan: ${{ steps.plan.outputs.run_ci_plan }}
      run_cli_hook_enforcement: ${{ steps.plan.outputs.run_cli_hook_enforcement }}
      run_cloud_native: ${{ steps.plan.outputs.run_cloud_native }}
      run_coding_standards: ${{ steps.plan.outputs.run_coding_standards }}
      run_installers: ${{ steps.plan.outputs.run_installers }}
      run_interrupted_recovery: ${{ steps.plan.outputs.run_interrupted_recovery }}
      run_local_env_mcp_tests: ${{ steps.plan.outputs.run_local_env_mcp_tests }}
      run_loops_routing: ${{ steps.plan.outputs.run_loops_routing }}
      run_mcp_tests: ${{ steps.plan.outputs.run_mcp_tests }}
      run_posix_regression: ${{ steps.plan.outputs.run_posix_regression }}
      run_posix_unwired_sharded: ${{ steps.plan.outputs.run_posix_unwired_sharded }}
      run_test: ${{ steps.plan.outputs.run_test }}
      run_test_windows_heavy: ${{ steps.plan.outputs.run_test_windows_heavy }}
      run_version_gates: ${{ steps.plan.outputs.run_version_gates }}
      run_version_gates_windows_bump: ${{ steps.plan.outputs.run_version_gates_windows_bump }}
      run_version_gates_windows_lanes: ${{ steps.plan.outputs.run_version_gates_windows_lanes }}
      run_windows_powershell: ${{ steps.plan.outputs.run_windows_powershell }}
      plan_artifact_name: ${{ steps.plan.outputs.plan_artifact_name }}
    steps:
      - name: Checkout tested plan inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout trusted base planner
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned structural parser dependencies
        shell: bash
        run: |-
          set -euo pipefail
          npm ci --prefix subject/mcp/sdd-forge-mcp --ignore-scripts
          if [[ -f trusted/mcp/sdd-forge-mcp/package-lock.json ]]; then
            npm ci --prefix trusted/mcp/sdd-forge-mcp --ignore-scripts
          fi
        env:
          npm_config_fetch_retries: '2'
          npm_config_loglevel: http
      - name: Generate revision-bound plan
        id: plan
        shell: bash
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_TESTED_SHA: ${{ github.sha }}
          CI_API_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_FORCE_FULL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.repository_id && 'true' || vars.SDD_CI_FORCE_FULL }}
        run: >
          set -euo pipefail

          subject="$GITHUB_WORKSPACE/subject"

          trusted="$GITHUB_WORKSPACE/trusted"

          planner="$subject/tests/verification-impact.py"

          if [[ "$CI_EVENT" == pull_request && -f "$trusted/tests/verification-impact.py" ]] &&
            grep -Fq 'verification-ci-plan/v1' "$trusted/tests/verification-impact.py" &&
            grep -Fq 'def plan_main(' "$trusted/tests/verification-impact.py"; then
            planner="$trusted/tests/verification-impact.py"
          fi

          if [[ "$CI_EVENT" != pull_request ]]; then
            trusted="$subject"
          fi

          mkdir -p "$RUNNER_TEMP/verification-plan"

          python3 -I -B "$planner" --plan --root "$subject" --trusted-root "$trusted" --event "$CI_EVENT" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --api-head-sha "$CI_API_HEAD_SHA" --tested-revision "$CI_TESTED_SHA" --base "$CI_BASE_SHA"
          --head "$CI_HEAD_SHA" --force-full "$CI_FORCE_FULL" --output "$RUNNER_TEMP/verification-plan/plan.json" --github-output
          "$GITHUB_OUTPUT"

          printf 'plan_artifact_name=verification-plan-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload original planning-attempt artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.plan.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/verification-plan/plan.json
          if-no-files-found: error
