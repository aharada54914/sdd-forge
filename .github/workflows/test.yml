name: Test (SDD Forge v2)

on:
  push:
    branches: [main, "feat/v2-*"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-guardrails:
    name: v2-guardrails (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run v2 Lightweight Guardrails & SDD Core tests
        run: node --test tests/v2-*.test.mjs

      - name: Verify SDD repository structure (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/check-sdd-structure.sh

      - name: Verify install.sh syntax (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n install.sh && bash -n uninstall.sh

  mcp-tests:
    name: mcp-tests (${{ matrix.mcp }})
    strategy:
      fail-fast: false
      matrix:
        mcp: [local-env-mcp, ci-mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp/${{ matrix.mcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/${{ matrix.mcp }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & test
        run: |
          npx tsc --noEmit
          npm test

  required-checks:
    name: required-checks
    runs-on: ubuntu-latest
    needs: [v2-guardrails, mcp-tests]
    timeout-minutes: 5
    steps:
      - name: Confirm all v2 required checks passed
        run: echo "All SDD Forge v2 required checks passed."
