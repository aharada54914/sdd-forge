name: T011 native archive diagnostic
on:
  push:
    branches:
      - t011/windows-archive-diagnostic-096235a2-20261021
permissions:
  contents: read
jobs:
  native-archive-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect native archive Unicode paths
        shell: pwsh
        run: python .github/scripts/native-archive-diagnostic.py
