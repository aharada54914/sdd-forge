name: T011 native archive diagnostic
on:
  push:
    branches:
      - t011/windows-archive-diagnostic-096235a2-20261021
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: true
jobs:
  focused-installer:
    name: Focused installer (${{ matrix.runtime }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [pwsh, powershell.exe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run actual archive and payload regressions
        shell: pwsh
        env:
          TEST_POWERSHELL: ${{ matrix.runtime }}
        run: |
          $env:PWSH = (Get-Command $env:TEST_POWERSHELL -ErrorAction Stop).Source
          & $env:PWSH -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          python tests/lib/install-payload-check.py --runtime powershell PayloadChecks.test_tracked_special_names_survive_local_and_archive PayloadChecks.test_windows_zip_metadata_and_containment PayloadChecks.test_archive_source_installs_the_same_payload PayloadChecks.test_mcp_placement_is_exactly_index_and_package PayloadChecks.test_windows_zip_directory_link_metadata
          exit $LASTEXITCODE
      - name: Probe native ZIP long paths
        if: always()
        shell: pwsh
        env:
          TEST_POWERSHELL: ${{ matrix.runtime }}
        run: |
          $env:PWSH = (Get-Command $env:TEST_POWERSHELL -ErrorAction Stop).Source
          python .github/scripts/native-zip-longpath-probe.py
          exit $LASTEXITCODE
