name: Publish release (tag + GitHub Release)

# Creates the vX.Y.Z tag and GitHub Release on a commit of main from a manual
# dispatch, then starts release.yml to build, sign and attach the artifacts.
# It exists so a release can be cut without pushing a tag from a workstation:
# remote agent sessions can trigger a workflow but cannot push tags.
#
# release.yml still owns every release gate (CI green on the exact commit,
# deterministic suites, version consistency across all manifests). A Release
# created with GITHUB_TOKEN does not fire `release: published`, so this
# workflow dispatches release.yml explicitly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already merged to main, without the v (e.g. 2.1.1)"
        required: true
        type: string
      commit:
        description: "Full 40-character SHA of the release PR's merge commit on main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the version at the release commit
        id: check
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.Y.Z, got: ${VERSION}" >&2
            exit 1
          fi
          # A full SHA cannot be shadowed by a same-named tag or branch.
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full 40-character lowercase SHA, got: ${COMMIT}" >&2
            exit 1
          fi
          TARGET="$(git rev-parse --verify --quiet "${COMMIT}^{commit}")" || {
            echo "commit ${COMMIT} is not in this repository" >&2
            exit 1
          }
          if [ "$TARGET" != "$COMMIT" ]; then
            echo "commit ${COMMIT} resolved to ${TARGET}" >&2
            exit 1
          fi
          # On main's first-parent line: a merge commit (or a direct commit),
          # never a commit that only exists on a merged PR branch.
          if ! git rev-list --first-parent "$GITHUB_SHA" | grep -x "$TARGET" >/dev/null; then
            echo "${TARGET} is not on main's first-parent history" >&2
            exit 1
          fi
          git checkout -q --detach "$TARGET"
          TAG="v${VERSION}"
          if ! grep -Eq "^## ${TAG//./\\.} \(" CHANGELOG.md; then
            echo "CHANGELOG.md on main has no '## ${TAG} (' heading" >&2
            exit 1
          fi
          SHIPPED="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("plugins/sdd-ship/.claude-plugin/plugin.json","utf8")).version)')"
          if [ "$SHIPPED" != "$VERSION" ]; then
            echo "plugin manifests on main are at ${SHIPPED}, not ${VERSION}" >&2
            exit 1
          fi
          # Singular endpoint: an exact match, not a prefix. Only 404 means absent.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>"${RUNNER_TEMP}/ref.err"; then
            echo "tag ${TAG} already exists; refusing to move it" >&2
            exit 1
          elif ! grep -q 'HTTP 404' "${RUNNER_TEMP}/ref.err"; then
            echo "could not check whether ${TAG} exists:" >&2
            cat "${RUNNER_TEMP}/ref.err" >&2
            exit 1
          fi
          # Publish nothing unless test.yml already passed on this exact commit;
          # release.yml re-checks it, but a failure there would leave an empty
          # Release behind that this workflow refuses to retry.
          # Count only runs release.yml accepts: this exact commit, tested by a
          # push to main or a manual dispatch (a PR run tests a synthetic merge).
          GREEN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${TARGET}&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${TARGET}\" and .conclusion == \"success\" and ((.event == \"push\" and .head_branch == \"main\") or .event == \"workflow_dispatch\"))] | length")"
          if [[ ! "$GREEN" =~ ^[0-9]+$ ]]; then
            echo "could not count successful test.yml runs for ${TARGET}: ${GREEN}" >&2
            exit 1
          fi
          if [ "$GREEN" -lt 1 ]; then
            echo "no successful test.yml run for ${TARGET} yet; wait for CI and dispatch again" >&2
            exit 1
          fi
          # Release notes: the CHANGELOG section for this version.
          awk -v head="## ${TAG} (" '
            index($0, head) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          test -s "${RUNNER_TEMP}/notes.md"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Create the tag and GitHub Release on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          TARGET: ${{ steps.check.outputs.target }}
        run: |
          set -euo pipefail
          # Creating the ref is atomic: GitHub answers 422 if the tag appeared
          # since the check, so an existing tag is never adopted or moved.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="$TARGET" >/dev/null
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "${RUNNER_TEMP}/notes.md"
          echo "Created ${TAG} at ${TARGET}"

      - name: Build, sign and attach artifacts (release.yml)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
