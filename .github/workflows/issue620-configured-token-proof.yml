name: Configured weekly PR credential proof

on:
  push:
    branches: [verify/issue620-factory-adapter-20261027]

permissions:
  contents: read
  pull-requests: write

jobs:
  actual-selected-credential:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify the same credential selected by the weekly session
        env:
          GH_TOKEN: ${{ secrets.SDD_SESSION_PR_TOKEN || github.token }}
          DEFAULT_WORKFLOW_TOKEN: ${{ github.token }}
          CREDENTIAL_SOURCE: ${{ secrets.SDD_SESSION_PR_TOKEN != '' && 'configured-session-token' || 'default-workflow-token' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/aharada54914/sdd-forge/pulls/655 > "$RUNNER_TEMP/before.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'before.json').read_text())
          assert pr['draft'] is True and pr['state'] == 'open'
          assert pr['base']['ref'] == 'main'
          assert pr['head']['sha'] == '4f602f7a4160009239b95a26e6b24c305ecc61dd'
          assert pr['title'] == 'fix(deps): repair MCP production dependency audit on main'
          PY
          # Prove content-write separately; no branch history or source bytes change.
          gh api --method PATCH repos/aharada54914/sdd-forge/git/refs/heads/auto/improve-20261026 \
            -f sha=4f602f7a4160009239b95a26e6b24c305ecc61dd -F force=false > "$RUNNER_TEMP/ref.json"
          echo 'Selected session credential: content write accepted.'
          # Default-token PR writes do not need the configured PAT's missing PR-write scope.
          GH_TOKEN="$DEFAULT_WORKFLOW_TOKEN" gh api --method PATCH repos/aharada54914/sdd-forge/pulls/655 \
            -f title='fix(deps): repair MCP production dependency audit on main' > "$RUNNER_TEMP/after.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          before, after = [json.loads((root / name).read_text()) for name in ('before.json', 'after.json')]
          assert all(before[key] == after[key] for key in ('title', 'body', 'state', 'draft'))
          assert before['head']['sha'] == after['head']['sha']
          print(json.dumps({'credential_source': os.environ['CREDENTIAL_SOURCE'],
              'pull_request': after['number'], 'idempotent_write': 'accepted',
              'pr_credential_source': 'default-workflow-token',
              'content_unchanged': True, 'head': after['head']['sha'],
              'token_values_read_or_printed': False}))
          PY
