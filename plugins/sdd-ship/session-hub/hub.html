<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDD Forge — 質問窓口</title><link rel="stylesheet" href="/hub/hub.css"></head><body><main><header><h1>質問・実行の窓口</h1><a href="/">開発状況に戻る</a><button id="refresh">今すぐ更新</button></header><p>各セッションの質問に回答し、受領まで確認できます。回答はタスクの承認・完了を変更しません。</p><p id="notice" role="status" aria-live="polite">接続を確認しています</p><form id="login" hidden><label>ローカル窓口のアクセストークン<input id="token" type="password" autocomplete="off" required></label><button>接続</button></form><section><h2>マージ前の検証</h2><div id="verification">未取得</div><small>取り込んだ検証結果です。最新のPRコミットと必須チェックはGitHubでも確認してください。自動マージは行いません。</small></section><section><header><h2>質問</h2><label>表示<select id="filter"><option value="open">要回答</option><option value="answered">受領待ち</option><option value="received">解決済み</option><option value="all">すべて</option></select></label></header><div id="questions"></div></section><section><h2>離席モード</h2><p id="away-state"></p><button id="away" aria-pressed="false">離席モードを有効にする</button><p>許可済みコマンドを同時に1件実行します。無効にすると新規着手を止めます。実行中の作業は個別に停止できます。</p><form id="enqueue"><label>実行セッション<select id="session" required></select></label><label>許可済みコマンドID<input id="command" pattern="[a-zA-Z0-9_-]{1,80}" required maxlength="80"></label><label>作業名<input id="job-title" required maxlength="200"></label><button>この作業の実行を許可して追加</button></form><ol class="jobs" id="jobs"></ol><small>ワーカーや環境が停止すると実行は進みません。結果不明の作業は自動再実行しません。</small></section><section><h2>接続セッション</h2><ul id="sessions"></ul></section></main><script type="module" src="/hub/client.mjs"></script></body></html>
