workflow:
  capability_enforcement: advisory
components:
  - name: desktop
    paths:
      include:
        - "src/desktop/**"
      exclude:
        - "src/desktop/generated/**"
  - name: mobile
    paths:
      include:
        - "src/mobile/**"
shared_paths:
  - pattern: "contracts/**"
    components:
      - desktop
      - mobile
