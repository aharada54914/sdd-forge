summary: "Python test modules outside test directories miss the retirement approval check"
problem: |
  A root-level test_checkout.py is discoverable by Python unittest. The path classifier
  only recognizes selected directory and suffix patterns, so this test misses the path and
  blob approval lookup required by AC-009. The previous Python case uses tests/sample_test.py.
expected_fix:
  - Recognize the supported Python test module convention outside designated test directories.
  - Check both the unapproved deletion and the matching approved path and blob, with an ordinary Python module as a control.
