name: Test installers and gates

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# Cancel superseded runs of the same pull request. Pushes to main and
# merge-queue runs fall back to the unique run_id group, so they are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: review-loop prechecks and provenance tests resolve
          # recorded commit hashes (e.g. TDD Red commits) via git rev-parse.
          fetch-depth: 0

      - name: Verify generated guard invariants (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python ./plugins/sdd-quality-loop/scripts/generate-guard-invariants.py --check

      - name: Verify generated guard invariants (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 ./plugins/sdd-quality-loop/scripts/generate-guard-invariants.py --check

      # pwsh steps run the test scripts directly: piping through tee changes
      # pwsh exit-code semantics ($LASTEXITCODE leakage), and the job console
      # log already captures their output.
      - name: Validate workflow state (PowerShell)
        shell: pwsh
        run: ./plugins/sdd-quality-loop/scripts/check-workflow-state.ps1

      - name: Validate workflow state (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./plugins/sdd-quality-loop/scripts/check-workflow-state.sh

      - name: Validate repository
        shell: pwsh
        run: ./tests/validate-repository.ps1

      - name: Validate repository (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/validate-repository.sh

      - name: Test repository release validation parity
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/repository-release-validation.tests.sh

      - name: Test deterministic gate scripts
        shell: pwsh
        run: ./tests/scripts.tests.ps1

      - name: Test selected-feature structure validation
        shell: pwsh
        run: ./tests/structure-check-feature-mode.tests.ps1

      - name: Test quality-gate cycle-limit suite (bash)
        shell: bash
        run: bash ./tests/quality-gate-cycle-limit.tests.sh

      - name: Test portable review-loop prechecks (pwsh)
        shell: pwsh
        run: |
          ./tests/review-contract-foundation.tests.ps1
          ./tests/downstream-review-precheck.tests.ps1
          ./tests/impl-layer-review-inputs.tests.ps1
          ./tests/task-layer-review-inputs.tests.ps1

      - name: Test cross-model gate (pwsh)
        shell: pwsh
        run: ./tests/cross-model.tests.ps1

      - name: Test Phase 2 guard invariants (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/phase2-guard-invariants.tests.ps1

      - name: Test Phase 2 guard invariants (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./tests/phase2-guard-invariants.tests.sh

      - name: Test hook guards
        shell: pwsh
        run: ./tests/hooks.tests.ps1

      - name: Test cross-runtime scenario suite (pwsh)
        shell: pwsh
        run: ./tests/scenario.tests.ps1

      - name: Test guards (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./tests/guards.tests.sh 2>&1 | tee "${{ runner.temp }}/guards-tests.log"

      - name: Test approval boundary (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/approval-boundary.tests.sh 2>&1 | tee "${{ runner.temp }}/approval-boundary-tests.log"

      - name: Test deterministic gates (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./tests/gates.tests.sh 2>&1 | tee "${{ runner.temp }}/gates-tests.log"

      - name: Test panelist-input consent gate (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/prepare-panelist.tests.sh 2>&1 | tee "${{ runner.temp }}/prepare-panelist-tests.log"

      - name: Test panelist-input consent gate (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/prepare-panelist.tests.ps1

      - name: Test portable review-loop prechecks (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/review-contract-foundation.tests.sh
          bash tests/review-contract-foundation-parity.tests.sh
          bash tests/spec-review-loop.tests.sh
          bash tests/downstream-review-precheck.tests.sh
          bash tests/downstream-review-precheck-parity.tests.sh
          bash tests/impl-layer-review-inputs.tests.sh
          bash tests/task-layer-review-inputs.tests.sh
          bash tests/task-layer-full-profile.tests.sh
          bash tests/task-review-precheck.tests.sh
          bash tests/review-agent-isolation.tests.sh

      - name: Test cross-model gate (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/cross-model.tests.sh 2>&1 | tee "${{ runner.temp }}/cross-model-tests.log"

      - name: Test outcome-based eval suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/eval.tests.sh 2>&1 | tee "${{ runner.temp }}/eval-tests.log"

      - name: Test CRLF line-ending parity (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/crlf-parity.tests.sh 2>&1 | tee "${{ runner.temp }}/crlf-parity-tests.log"

      - name: Test cross-runtime scenario suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/scenario.tests.sh 2>&1 | tee "${{ runner.temp }}/scenario-tests.log"

      - name: Test branch-protection script (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/apply-branch-protection.tests.sh 2>&1 | tee "${{ runner.temp }}/apply-branch-protection-tests.log"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: test-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  # installers -- the install/uninstall suites clone a source fixture and
  # perform real filesystem installs per scenario, which dominated the old
  # single test job (27+ min on the macOS leg alone). They run as their own
  # parallel job so the gate suites above are not serialized behind them.
  # Shallow checkout suffices here -- the fixtures archive HEAD and the
  # remote-installer steps resolve $GITHUB_SHA through the GitHub API.
  installers:
    name: installers
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify generated guard invariants (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python ./plugins/sdd-quality-loop/scripts/generate-guard-invariants.py --check

      - name: Verify generated guard invariants (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 ./plugins/sdd-quality-loop/scripts/generate-guard-invariants.py --check

      - name: Install recorded Claude Code CLI
        shell: bash
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate Claude plugin manifests (real CLI)
        shell: pwsh
        run: ./tests/claude-manifest-validation.tests.ps1

      - name: Test installer (pwsh)
        shell: pwsh
        run: ./tests/install.tests.ps1

      - name: Test uninstaller (pwsh)
        shell: pwsh
        run: ./tests/uninstall.tests.ps1

      - name: Test Claude registration (pwsh)
        shell: pwsh
        run: ./tests/claude-registration.tests.ps1

      - name: Test authenticated remote installer (pwsh)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./install.ps1 -Ref $env:GITHUB_SHA -InstallRoot (Join-Path $env:RUNNER_TEMP "sdd-remote-pwsh") -Target FilesOnly

      - name: Test POSIX installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n ./tests/release-host-smoke.sh
          ./tests/install.tests.sh 2>&1 | tee "${{ runner.temp }}/install-tests-sh.log"

      - name: Test POSIX uninstaller
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./tests/uninstall.tests.sh 2>&1 | tee "${{ runner.temp }}/uninstall-tests-sh.log"

      - name: Test authenticated remote installer (bash)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./install.sh --ref "$GITHUB_SHA" --install-root "${RUNNER_TEMP}/sdd-remote-bash" --target FilesOnly

      - name: Upload installer test logs
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: installer-test-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  # loops-routing -- loop inventory/driver/consistency/escalation plus the
  # agent-model routing, capabilities, frontmatter and placeholder suites.
  # Pure file/manifest assertions with no git-history or CLI dependency.
  loops-routing:
    name: loops-routing
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test template-validator parity (bash)
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/template-validator-parity.tests.sh

      - name: Test template-validator parity (pwsh)
        shell: pwsh
        run: ./tests/template-validator-parity.tests.ps1

      - name: Test loop inventory registration forcing (bash)
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/loop-inventory.tests.sh

      - name: Test loop inventory registration forcing (pwsh)
        shell: pwsh
        run: ./tests/loop-inventory.tests.ps1

      - name: Test loop driver smoke suite (bash)
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/loop-driver.tests.sh

      - name: Test loop driver smoke suite (pwsh)
        shell: pwsh
        run: ./tests/loop-driver.tests.ps1

      - name: Test loop consistency suite (bash)
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/loop-consistency.tests.sh

      - name: Test loop consistency suite (pwsh)
        shell: pwsh
        run: ./tests/loop-consistency.tests.ps1

      - name: Test loop escalation suite (bash)
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/loop-escalation.tests.sh

      - name: Test loop escalation suite (pwsh)
        shell: pwsh
        run: ./tests/loop-escalation.tests.ps1

      - name: Test agent-model-capabilities v2 registry parity lock (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/agent-capabilities-v2.tests.sh

      - name: Test agent-model-capabilities v2 registry parity lock (pwsh)
        shell: pwsh
        run: ./tests/agent-capabilities-v2.tests.ps1

      - name: Test render-agent-frontmatter suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/render-agent-frontmatter.tests.sh

      - name: Test render-agent-frontmatter suite (pwsh)
        shell: pwsh
        run: ./tests/render-agent-frontmatter.tests.ps1

      - name: Test turn-first agent-model routing suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/agent-model-routing.tests.sh

      - name: Test turn-first agent-model routing suite (pwsh)
        shell: pwsh
        run: ./tests/agent-model-routing.tests.ps1

      - name: Test HITL/WFI-audit terminal-behavior suite (bash)
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/hitl-wfi-terminal.tests.sh

      - name: Test HITL/WFI-audit terminal-behavior suite (pwsh)
        shell: pwsh
        run: ./tests/hitl-wfi-terminal.tests.ps1

      - name: Test check-placeholders brownfield behavior lock (bash)
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/check-placeholders-brownfield.tests.sh

      - name: Test check-placeholders brownfield behavior lock (pwsh)
        shell: pwsh
        run: ./tests/check-placeholders-brownfield.tests.ps1

      - name: Test run-panelist-effort suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/run-panelist-effort.tests.sh

      - name: Test run-panelist-effort suite (pwsh)
        shell: pwsh
        run: ./tests/run-panelist-effort.tests.ps1

  # version-gates -- the bump-version and release loop-gate suites are the
  # slowest non-installer steps on Windows (~9 min combined), so they get
  # their own parallel job together with the model-freshness suite.
  version-gates:
    name: version-gates
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test bump-version.sh loop-gate prerequisite (bash)
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/bump-version-gate.tests.sh

      - name: Test bump-version.sh loop-gate prerequisite (pwsh)
        shell: pwsh
        run: ./tests/bump-version-gate.tests.ps1

      - name: Test release.yml required loop-gate job (bash)
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/release-loop-gate.tests.sh

      - name: Test release.yml required loop-gate job (pwsh)
        shell: pwsh
        run: ./tests/release-loop-gate.tests.ps1

      - name: Test model-freshness-check suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/model-freshness-check.tests.sh

      - name: Test model-freshness-check suite (pwsh)
        shell: pwsh
        run: ./tests/model-freshness-check.tests.ps1

      - name: Test project-context-schema suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/project-context-schema.tests.sh

      - name: Test project-context-schema suite (pwsh)
        shell: pwsh
        run: ./tests/project-context-schema.tests.ps1

      - name: Test approver-registry-schema suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/approver-registry-schema.tests.sh

      - name: Test approver-registry-schema suite (pwsh)
        shell: pwsh
        run: ./tests/approver-registry-schema.tests.ps1

      # epic-189-a1-project-context T-013 (REQ-011, AC-028): CI-staging
      # reconciliation. T-001..T-012 each appended their own step to this
      # staged candidate incrementally, and eight suites were left unregistered
      # here while already registered in tests/run-all.{sh,ps1}. This block
      # closes that drift so the staged candidate covers every suite the epic
      # added, in both runtimes. All of these are deterministic: no LLM, no
      # network, no `gh`, and no live sudo grant.
      - name: Test canonicalize-sdd-yaml suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/canonicalize-sdd-yaml.tests.sh

      - name: Test canonicalize-sdd-yaml suite (pwsh)
        shell: pwsh
        run: ./tests/canonicalize-sdd-yaml.tests.ps1

      - name: Test generate-approval-sidecar suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/generate-approval-sidecar.tests.sh

      - name: Test generate-approval-sidecar suite (pwsh)
        shell: pwsh
        run: ./tests/generate-approval-sidecar.tests.ps1

      - name: Test detect-policy-weakening suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/detect-policy-weakening.tests.sh

      - name: Test detect-policy-weakening suite (pwsh)
        shell: pwsh
        run: ./tests/detect-policy-weakening.tests.ps1

      - name: Test validate-approval-sidecar suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/validate-approval-sidecar.tests.sh

      - name: Test validate-approval-sidecar suite (pwsh)
        shell: pwsh
        run: ./tests/validate-approval-sidecar.tests.ps1

      - name: Test apply-human-copy publisher suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/apply-human-copy.tests.sh

      - name: Test apply-human-copy publisher suite (pwsh)
        shell: pwsh
        run: ./tests/apply-human-copy.tests.ps1

      - name: Test hook-activation handshake suite (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/check-hook-activation-handshake.tests.sh

      - name: Test hook-activation handshake suite (pwsh)
        shell: pwsh
        run: ./tests/check-hook-activation-handshake.tests.ps1

      - name: Test epic-a1 guard-invariants registration (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/guard-invariants-epic-a1.tests.sh

      - name: Test epic-a1 guard-invariants registration (pwsh)
        shell: pwsh
        run: ./tests/guard-invariants-epic-a1.tests.ps1

      # R-10 guard-fix package (staging exemption + command-prose pre-filter),
      # discovered while implementing T-001. Bash-only: it drives
      # sdd-hook-guard.{py,js,ps1} directly through one POSIX harness, so it has
      # no .ps1 twin. That twin-pair gap is a recorded carryover, not a silent
      # omission -- see reports/notes/epic-189-a1-carryover-items.md.
      - name: Test R-10 guard staging exemption and prose pre-filter (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/guard-staging-exemption.tests.sh

      # T-010 (REQ-008, AC-023): protected-write full-matrix deny. Drives the
      # guard directly with synthetic payloads (no agent in the loop) across
      # 4 basenames x 12 surfaces x 2 SDD_SUDO states in each runtime.
      - name: Test hook-guard epic-a1 write-boundary matrix (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/hook-guard-epic-a1-boundary.tests.sh

      - name: Test hook-guard epic-a1 write-boundary matrix (pwsh)
        shell: pwsh
        run: ./tests/hook-guard-epic-a1-boundary.tests.ps1

      # T-011 (REQ-009, AC-024/AC-026/AC-039): ADR-0023 track-selection
      # contract conformance for PLUGIN-CONTRACTS.md and the three UNPROTECTED
      # migrated consumers. Fixture-driven -- it builds real project trees and
      # drives the real approval signer/validator, with no agent in the loop.
      - name: Test plugin-contracts track-selection contract (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/plugin-contracts-track-selection.tests.sh

      - name: Test plugin-contracts track-selection contract (pwsh)
        shell: pwsh
        run: ./tests/plugin-contracts-track-selection.tests.ps1

      # epic-189-a1-project-context T-012 (REQ-009/REQ-010): the ADR-0023
      # migration of the two PROTECTED track-selection consumers, asserted
      # against their staged candidates, plus AC-039's full 30-assertion
      # five-consumer matrix and AC-035's full entry-point wiring inventory.
      # Green in both publication states, so it does not depend on whether the
      # human apply step has run yet.
      - name: Test ship track-selection migration (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/ship-track-selection-migration.tests.sh

      - name: Test ship track-selection migration (pwsh)
        shell: pwsh
        run: ./tests/ship-track-selection-migration.tests.ps1

      # epic-193-a5-capability-resolver T-001 (REQ-002, TEST-017..020):
      # contracts/resolver-evidence.schema.json conformance over 12 hand-built
      # fixtures, driven by the stdlib-only schema checker (no agent, no
      # network, no third-party validator).
      - name: Test resolver evidence schema (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/resolver-evidence-schema.tests.sh

      - name: Test resolver evidence schema (pwsh)
        shell: pwsh
        run: ./tests/resolver-evidence-schema.tests.ps1

      # epic-193-a5-capability-resolver T-002 (REQ-002/REQ-003, TEST-010..015/
      # 038/041): the steps 0-3 Block matrix plus the step 3 Context Projection
      # shape. Runs the staged resolve-project-context candidate under
      # specs/epic-193-a5-capability-resolver/human-copy/ against real fixture
      # repositories; the live plugins/ tree is never touched. Ordered after
      # the T-001 resolver-evidence checks, which this suite's evidence
      # assertions reuse.
      - name: Test project-context block resolver (bash)
        if: runner.os != 'Windows'
        shell: bash
        # Invoked via bash explicitly so the step does not depend on the
        # committed exec bit (Windows-authored commits record mode 100644).
        run: bash ./tests/resolve-project-context-block.tests.sh

      - name: Test project-context block resolver (pwsh)
        shell: pwsh
        run: ./tests/resolve-project-context-block.tests.ps1

  # mcp-tests — sdd-forge-mcp (mcp/sdd-forge-mcp/) is the repo's first
  # Node/TypeScript component: a read-only MCP server exposing SDD workflow
  # state. Its tasks.md state-machine parser must stay shell-equivalent with
  # check-task-state.sh (golden tests), so it is exercised across the same
  # 3-OS matrix as the rest of the suite. On POSIX runners the golden tests
  # execute the real shell scripts; on Windows they compare against recorded
  # fixtures (process.platform branch inside the test suite itself).
  mcp-tests:
    name: mcp-tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp/sdd-forge-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the golden task-state tests exercise
          # check-evidence-bundle, which resolves each bundle's recorded
          # git_commit binding via git; a shallow clone cannot see them.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/sdd-forge-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # dist-parity (AC-010): rebuild the esbuild bundle and confirm the
      # working tree's committed dist/index.js is reproducible from source.
      # Runs once on Linux to keep the check OS-agnostic and fast; esbuild
      # output is deterministic across platforms for this bundle.
      - name: Rebuild dist and verify parity
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run build
          git diff --exit-code -- dist/

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high

  # B2 — exercise the SDD hook guard with the REAL CLI toolchains installed on
  # each OS, through the exact command line each CLI's hook config invokes. This
  # closes the gap that the unit/scenario suites only run the guard scripts in
  # isolation; here Claude Code / Codex / Copilot binaries are actually present.
  # (A live agent session that fires the hook needs an API-key secret and is
  # non-deterministic, so it is not gated here — the deterministic enforcement
  # below is what protects the branch.)
  # local-env-mcp-tests — local-env-mcp (mcp/local-env-mcp/) is a read-only
  # MCP server exposing local environment info (OS, toolchain versions, CLI
  # availability) with no execution capability (ADR-0003/ADR-0004 pattern,
  # same shape as sdd-forge-mcp). Exercised across the same 3-OS matrix as
  # sdd-forge-mcp's mcp-tests job.
  local-env-mcp-tests:
    name: local-env-mcp-tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp/local-env-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/local-env-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # dist-parity (AC-008): rebuild the esbuild bundle and confirm the
      # working tree's committed dist/index.js is reproducible from source.
      # Runs once on Linux to keep the check OS-agnostic and fast; esbuild
      # output is deterministic across platforms for this bundle (verified
      # locally: two independent builds produced an identical SHA-256).
      - name: Rebuild dist and verify parity
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run build
          git diff --exit-code -- dist/

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high

  # ci-mcp-tests — ci-mcp (mcp/ci-mcp/) is a read-only MCP server exposing
  # GitHub Actions CI state (workflow runs, jobs, job logs, artifacts
  # metadata) over a GET-only api.github.com client (ADR-0003 pattern, same
  # shape as sdd-forge-mcp / local-env-mcp). Exercised across the same 3-OS
  # matrix; its own test suite (fake GitHub API fixtures) makes no real
  # network call, so CI stays outbound-connection-free (design.md
  # "Deployment / CI Plan").
  ci-mcp-tests:
    name: ci-mcp-tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp/ci-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/ci-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Includes the AC-015 Inspector CLI smoke test (tests/smoke/), which
      # spawns the bundled dist/index.js over real stdio — its before()
      # hook builds dist/ on demand if absent, so this step alone is
      # sufficient even before the parity step below runs.
      - name: Run tests
        run: npm test

      # dist-parity (AC-014): rebuild the esbuild bundle and confirm the
      # working tree's committed dist/index.js is reproducible from source.
      # Runs once on Linux to keep the check OS-agnostic and fast; esbuild
      # output is deterministic across platforms for this bundle (verified
      # locally: two independent builds produced an identical SHA-256).
      - name: Rebuild dist and verify parity
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run build
          git diff --exit-code -- dist/

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high

  cli-hook-enforcement:
    name: cli-hook-enforcement
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Claude Code CLI
        shell: bash
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex CLI (best-effort)
        shell: bash
        continue-on-error: true
        run: npm install -g @openai/codex

      - name: Install Copilot CLI (best-effort)
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-copilot

      - name: CLI hook enforcement (real toolchain present)
        shell: pwsh
        run: ./tests/cli-hook-enforcement.ps1

  required-checks:
    name: required-checks
    if: always()
    needs: [test, installers, loops-routing, version-gates, mcp-tests, local-env-mcp-tests, ci-mcp-tests, cli-hook-enforcement]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all required tests passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job failed"
            exit 1
          fi
          if [ "${{ needs.installers.result }}" != "success" ]; then
            echo "installers job failed"
            exit 1
          fi
          if [ "${{ needs.loops-routing.result }}" != "success" ]; then
            echo "loops-routing job failed"
            exit 1
          fi
          if [ "${{ needs.version-gates.result }}" != "success" ]; then
            echo "version-gates job failed"
            exit 1
          fi
          if [ "${{ needs.mcp-tests.result }}" != "success" ]; then
            echo "mcp-tests job failed"
            exit 1
          fi
          if [ "${{ needs.local-env-mcp-tests.result }}" != "success" ]; then
            echo "local-env-mcp-tests job failed"
            exit 1
          fi
          if [ "${{ needs.ci-mcp-tests.result }}" != "success" ]; then
            echo "ci-mcp-tests job failed"
            exit 1
          fi
          if [ "${{ needs.cli-hook-enforcement.result }}" != "success" ]; then
            echo "cli-hook-enforcement job failed"
            exit 1
          fi
          echo "all required checks passed"
